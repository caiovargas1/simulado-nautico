<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulado Náutico</title>
<meta name="description" content="Simulado para habilitação náutica: prova de 40 questões, estudo por tema, treino de erros e dicas.">
<meta name="theme-color" content="#0D2A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulado Náutico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de 760px. Cartão de prova em azul-marinho no topo, temas como linhas de lista com barra de acerto,
   e na prova o enunciado vem antes das alternativas, com barra de progresso fina e mapa das 40 questões recolhido. */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#0D2438; --muted:#51677A; --line:#CCD8E1;
  --accent:#0B5FA5; --accent-ink:#FFFFFF; --accent-soft:#DCEAF6;
  --hero:#0D2A47; --hero-ink:#F2F7FB; --hero-muted:#B5C8D9;
  --ok:#1B7A49; --ok-soft:#DDF1E5; --bad:#B8322A; --bad-soft:#F9E0DD;
  --hint:#7A5400; --hint-soft:#FFF1CC;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1824; --surface:#11263A; --ink:#E4EDF5; --muted:#9FB3C5; --line:#264057;
    --accent:#62AEF2; --accent-ink:#06182A; --accent-soft:#153A5C;
    --hero:#15395B; --hero-ink:#F2F7FB; --hero-muted:#B5C8D9;
    --ok:#55C98F; --ok-soft:#12362A; --bad:#F58A82; --bad-soft:#43201E;
    --hint:#F1C96A; --hint-soft:#3B2E0E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1824; --surface:#11263A; --ink:#E4EDF5; --muted:#9FB3C5; --line:#264057;
  --accent:#62AEF2; --accent-ink:#06182A; --accent-soft:#153A5C;
  --hero:#15395B; --hero-ink:#F2F7FB; --hero-muted:#B5C8D9;
  --ok:#55C98F; --ok-soft:#12362A; --bad:#F58A82; --bad-soft:#43201E;
  --hint:#F1C96A; --hint-soft:#3B2E0E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand b{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;
  border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.light{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:600;min-height:44px}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.02em}

/* Cartão da prova */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h2{font-family:var(--font-display);font-size:40px;line-height:1;font-weight:700;letter-spacing:.01em}
.hero p{color:var(--hero-muted);max-width:56ch}
.hero .row{display:flex;flex-wrap:wrap;gap:12px}
.hero .btn.ghost{color:var(--hero-ink);border-color:var(--hero-muted)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted);font-size:15px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Temas */
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 14px;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row-t:first-child{border-top:0}
.row-t .nm{font-weight:600}
.row-t .sub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar>i.low{background:var(--bad)}
.bar>i.good{background:var(--ok)}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist .h:first-child{border-top:0}
.hist .when{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;max-width:70ch}

/* Pills */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}

/* Prova e estudo */
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.qhead .c{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.qhead .pos{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.qhead .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.chip{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.qtext{font-size:19px;line-height:1.45;font-weight:500;text-wrap:pretty}
.fig{max-width:360px}
.fig svg{display:block;width:100%;height:auto;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:52px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.opt .otx{padding-top:2px;overflow-wrap:anywhere}
.opt .otag{font-size:13px;font-weight:600;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.right .otag{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.wrong .otag{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){color:var(--muted)}
.hintbox{background:var(--hint-soft);color:var(--hint);border-radius:10px;padding:12px 14px}
.hintbox b{font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin-right:6px}
.fb{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb strong{font-weight:600}
.fb.ok strong{color:var(--ok)}
.fb.bad strong{color:var(--bad)}
.ref{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .btn[aria-pressed="true"]{background:var(--hint-soft);border-color:var(--hint);color:var(--hint)}
.nav{display:flex;justify-content:space-between;gap:12px}
.nav .btn{flex:1;max-width:240px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
.map summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:4px 0 16px}
.grid button{position:relative;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.grid button.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:3px solid var(--accent);outline-offset:1px}
.grid button.f::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--hint)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);padding-bottom:12px}
.confirm{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.confirm .row{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;min-width:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}

/* Resultado */
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--font-display);font-weight:700;line-height:.95;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.big span{font-size:88px}
.big small{font-size:36px;color:var(--muted);font-weight:600}
.pct{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-variant-numeric:tabular-nums}
.bars .b .bar{grid-column:1/-1;margin-top:4px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.rv{display:flex;flex-direction:column;gap:14px}
.rvi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rvi .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rvi .n{font-family:var(--font-display);font-weight:700;font-size:20px}
.rvi ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rvi li{display:flex;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);overflow-wrap:anywhere}
.rvi li.right{background:var(--ok-soft);border-color:var(--ok)}
.rvi li.wrong{background:var(--bad-soft);border-color:var(--bad)}
.rvi li em{font-style:normal;font-size:13px;font-weight:600;margin-left:auto;white-space:nowrap;padding-left:8px}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* Ajuda */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,15,25,.6);display:flex;align-items:flex-start;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.ov[hidden]{display:none}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.dlg h2{font-family:var(--font-display);font-size:30px;font-weight:700}
.dlg h3{font-size:16px;font-weight:600}
.dlg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dlg kbd{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
.foot{color:var(--muted);font-size:13px;max-width:70ch}
@media (max-width:480px){
  .hero{padding:20px}.hero h2{font-size:34px}
  .big span{font-size:72px}
  .qtext{font-size:18px}
  .nav .btn{max-width:none}
}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
</style>

<div class="wrap" id="app"></div>
<div class="ov" id="help" hidden></div>

<script>
(function(){
'use strict';
var RAW = [["fund","O plano horizontal longitudinal que contém a superfície em que a embarcação flutua, dividindo o casco em obras vivas e obras mortas, é o plano de:",["Flutuação","Base","Diametral","Convés"],"O plano de flutuação contém a superfície em que a embarcação flutua. Abaixo dele ficam as obras vivas; acima, as obras mortas.","Pense no nível da água em que o casco flutua.","Fundamentos Gerais, 1.1",null,null],["fund","As obras vivas de uma embarcação correspondem à parte do casco que:",["Fica abaixo da superfície da água","Fica acima da superfície da água","Forma a superestrutura","Compreende somente o convés principal"],"Obras vivas são a parte do casco abaixo da linha de flutuação. A parte fora da água são as obras mortas.","Viva = está mergulhada, em contato com a água.","Fundamentos Gerais, 1.1",null,null],["fund","O plano vertical longitudinal, entre a proa e a popa, que divide a embarcação em bombordo e boreste é o plano:",["Diametral","De flutuação","De base","Do convés"],"O plano diametral é vertical, longitudinal, e separa os dois bordos: bombordo e boreste.","Diâmetro divide ao meio, no sentido do comprimento.","Fundamentos Gerais, 1.1",null,null],["fund","Um observador na linha diametral, voltado para a proa, tem:",["Boreste à sua direita e bombordo à sua esquerda","Bombordo à sua direita e boreste à sua esquerda","Boreste à sua direita e alheta à sua esquerda","Bombordo à sua direita e boreste à sua frente"],"Voltado para a proa, boreste (BE) fica à direita e bombordo (BB) à esquerda.","A luz verde fica a boreste, e a encarnada a bombordo.","Fundamentos Gerais, 1.2",null,null],["fund","A direção perpendicular ao plano longitudinal que corta o navio de proa a popa chama-se:",["Través","Alheta","Amura","Bochecha"],"Través é a direção perpendicular ao plano diametral, para qualquer dos bordos.","É a direção de lado, a 90° da proa.","Fundamentos Gerais, 1.2",null,null],["fund","As partes curvas do costado, de um bordo e de outro, próximas à popa, são chamadas de:",["Alheta","Bochecha","Amura","Través"],"Alheta é a parte curva do costado próxima à popa. Bochecha (ou amura) fica próxima à proa.","Alheta fica atrás; bochecha fica na frente.","Fundamentos Gerais, 1.2",null,null],["fund","O movimento de guinada (yaw) de uma embarcação é a rotação em torno do eixo:",["Vertical","Longitudinal","Transversal","Horizontal diametral"],"Yaw (guinada) é a rotação em torno do eixo vertical, que faz a proa mudar de direção.","Guinar é mudar o rumo, girando como um pião.","Fundamentos Gerais, 1.3",null,null],["fund","O movimento de arfagem ou caturro (pitch) é a rotação da embarcação em torno do eixo:",["Transversal","Longitudinal","Vertical","Diametral"],"Pitch (arfagem ou caturro) é a rotação em torno do eixo transversal: a proa sobe e a popa desce, e vice-versa.","Proa sobe e desce, como um cavalo de balanço.","Fundamentos Gerais, 1.3",null,null],["fund","O roll (jogo ou balanço) é a rotação da embarcação em torno do eixo:",["Longitudinal","Transversal","Vertical","De translação"],"Roll é a rotação em torno do eixo longitudinal, inclinando a embarcação de um bordo para o outro.","Inclinação lateral: um bordo desce enquanto o outro sobe.","Fundamentos Gerais, 1.3",null,null],["fund","Heave é o movimento de translação da embarcação no eixo:",["Vertical","Longitudinal","Transversal","De rotação"],"Heave é a translação no eixo vertical (sobe e desce como um todo). Surge é no longitudinal e sway no transversal.","Heave: o casco inteiro sobe e desce com a onda.","Fundamentos Gerais, 1.3",null,null],["fund","Calado é a distância vertical compreendida entre:",["O fundo da embarcação e a superfície da água onde ela flutua","A linha d'água e o convés principal, medidos na meia-nau","O convés principal e o ponto mais alto da superestrutura da embarcação","O fundo do mar e a superfície da água, no local da navegação"],"Calado é a distância vertical entre o fundo da embarcação e a superfície da água. Por isso as marcas de calado ficam no costado.","Mede quanto do casco está mergulhado.","Fundamentos Gerais, 1.4",null,null],["fund","A peça principal de sustentação da estrutura do casco, que corre da proa à popa e funciona como a coluna vertebral, é:",["A quilha","O cavername","O chapeamento","A borda"],"A quilha corre por toda a parte inferior do casco e é sua peça principal de sustentação. As cavernas saem dela como costelas.","Coluna vertebral do navio.","Fundamentos Gerais, 1.4",null,null],["fund","O conjunto de cavernas que dá forma ao casco recebe o nome de:",["Cavername","Chapeamento","Anteparas","Escotilha"],"O conjunto de cavernas é o cavername, o esqueleto do casco. Depois de formado ele recebe o chapeamento (revestimento).","Pense nas costelas do casco.","Fundamentos Gerais, 1.4",null,null],["fund","As divisórias verticais que formam os compartimentos de uma embarcação são chamadas de:",["Anteparas","Conveses","Cobertas","Vigias"],"Em uma embarcação não há paredes, e sim anteparas, que são as divisórias verticais dos compartimentos.","A palavra «parede» não é usada a bordo.","Fundamentos Gerais, 1.4",null,null],["fund","O castelo de proa é uma plataforma na proa onde ficam, entre outros itens:",["Os escovéns, as buzinas e o material das fainas de atracação e fundeio","A câmara do comandante, os camarotes e o camarim de navegação, a ré","O leme, a hélice e o eixo de transmissão da máquina, na popa","O tijupá, a agulha magnética e a antena do radar de navegação"],"No castelo ficam os escovéns (âncora), as buzinas (passagem das espias) e o material de atracação e fundeio.","É o setor da proa usado nas manobras com âncora e espias.","Fundamentos Gerais, 1.4",null,null],["fund","A navegação feita à vista de terra, usando pontos como montanhas, pontas e edificações para determinar a posição, é a navegação:",["Costeira","Astronômica","Eletrônica","Em águas restritas"],"Navegação costeira é feita à vista de terra, por acidentes naturais e artificiais, normalmente entre 3 e 50 milhas da costa.","Costa à vista: você usa a terra como referência.","Fundamentos Gerais, 1.5",null,null],["fund","A navegação praticada em portos, baías e proximidades, a menos de 3 milhas da costa, é chamada de navegação:",["Em águas restritas","Costeira","Astronômica","Estimada"],"Em águas restritas (menos de 3 milhas da costa) o espaço é pequeno e a precisão exigida é a maior.","Pouco espaço para manobrar: águas restritas.","Fundamentos Gerais, 1.5",null,null],["fund","A navegação que usa a observação do Sol, da Lua, de planetas e estrelas para determinar a posição é a navegação:",["Astronômica","Eletrônica","Costeira","Em águas restritas"],"Navegação astronômica usa corpos celestes e normalmente só é empregada em alto-mar, a mais de 50 milhas da costa.","Astro = estrela.","Fundamentos Gerais, 1.5",null,null],["nav","Os círculos horizontais que dividem a Terra a partir do Equador, e que determinam as latitudes, são os:",["Paralelos","Meridianos","Azimutes","Isobáticas"],"Paralelos são círculos paralelos ao Equador e determinam as latitudes.","Paralelos correm de leste a oeste.","Navegação, 2.1",null,null],["nav","O meridiano usado como ponto de partida para a contagem das longitudes é o de:",["Greenwich","O Equador","Brasília","Tordesilhas"],"A longitude é contada a partir do meridiano de Greenwich (Londres), até 180° para leste e 180° para oeste.","Passa em Londres.","Navegação, 2.1",null,null],["nav","A latitude é o arco de meridiano compreendido entre o Equador e o paralelo do lugar, contada de:",["0° a 90° para o Norte e para o Sul","0° a 180° para o Leste e para o Oeste","0° a 360° no sentido horário","0° a 90° apenas para o Norte"],"A latitude vai de 0° a 90°, Norte ou Sul, a partir do Equador.","Equador = 0°, Polos = 90°.","Navegação, 2.1",null,null],["nav","A longitude é o arco de Equador compreendido entre o meridiano de Greenwich e o meridiano do lugar, contada de:",["000° a 180° para leste e para oeste","00° a 90° para norte e para sul","000° a 360° no sentido horário","00° a 90° para leste e para oeste"],"A longitude vai de 000° a 180°, para Leste ou Oeste de Greenwich.","Mede-se sobre o Equador, até metade da volta.","Navegação, 2.1",null,null],["nav","Nas cartas náuticas, as latitudes são lidas e as distâncias são medidas na escala:",["Lateral, de latitudes","Superior, de longitudes","Inferior, de longitudes","Do cartucho da carta"],"As latitudes ficam nas laterais da carta e as longitudes em cima e embaixo. Distâncias são sempre medidas na escala de latitudes.","Um minuto de latitude vale uma milha.","Navegação, 2.2 e 2.4",null,null],["nav","Em uma carta na escala 1:200.000, 1 cm medido na carta representa na Terra:",["200.000 cm","200.000 m","20.000 cm","2.000.000 cm"],"A escala natural 1:200.000 significa que 1 cm na carta equivale a 200.000 cm no terreno (2 km).","Use a mesma unidade dos dois lados da razão.","Navegação, 2.2",null,null],["nav","As cartas que cobrem grandes trechos de costa, com escala pequena e poucos detalhes, chamam-se:",["Cartas gerais","Cartas particulares","Planos","Cartas de pormenor"],"Cartas gerais abrangem trechos longos, com escala pequena. Particulares abrangem trechos menores e planos são para portos e rios.","É como uma fotografia tirada de longe.","Navegação, 2.2",null,null],["nav","Os planos são cartas utilizadas para:",["Áreas que exigem todos os detalhes, como portos e trechos de rios","Viagens oceânicas, por abrangerem grandes trechos de mar","Navegação astronômica, em alto-mar e longe da costa","Cobrir grandes trechos do litoral, com escala pequena"],"Planos têm escala grande e servem para portos, trechos de rios e outras áreas que exigem todos os detalhes.","Máximo de detalhe, mínimo de área.","Navegação, 2.2",null,null],["nav","A linha que liga, na carta náutica, os pontos de mesma profundidade chama-se:",["Isobática","Meridiano","Paralelo","Rumo"],"Isobática é a linha que une pontos de igual profundidade na carta.","«Iso» é igual e «bata» é profundidade.","Navegação, 2.2",null,null],["nav","No Brasil, o órgão responsável pelas informações e levantamentos das cartas náuticas é a:",["Diretoria de Hidrografia e Navegação (DHN)","Agência Nacional de Telecomunicações","Capitania dos Portos de cada estado","União Internacional de Telecomunicações"],"A DHN, da Marinha, confecciona as cartas náuticas e faz os levantamentos de dados.","Hidrografia é o estudo do mar e das águas.","Navegação, 2.2",null,null],["nav","A milha náutica equivale a:",["1.852 metros","1.609 metros","1.000 metros","1.250 metros"],"Uma milha náutica tem 1.852 metros e corresponde a um minuto de latitude.","Não é a milha terrestre.","Navegação, 2.4",null,null],["nav","As cartas náuticas são orientadas pelo:",["Norte Verdadeiro","Norte Magnético","Norte da Agulha","Norte Giroscópico local"],"As cartas são orientadas pelo Norte Verdadeiro, sem influência da declinação magnética local. A rosa dos ventos traz a informação para obter o Norte Magnético.","Verdadeiro é o dos polos geográficos.","Navegação, 2.3",null,null],["nav","O ângulo entre o Norte Verdadeiro e a proa da embarcação, contado de 000° a 360° no sentido horário, é o:",["Rumo verdadeiro","Rumo magnético","Rumo da agulha","Marcação polar"],"Rumo verdadeiro é o ângulo entre o Norte Verdadeiro e a proa, contado no sentido horário.","Verdadeiro: referência ao Norte Verdadeiro.","Navegação, 2.3",null,null],["nav","A diferença angular entre o Norte Verdadeiro e o Norte Magnético chama-se:",["Declinação magnética","Desvio da agulha","Marcação relativa","Rumo no fundo"],"A declinação magnética varia conforme a região da Terra e pode ser leste ou oeste. Consta das cartas e pode ser atualizada.","Depende do lugar na Terra, não do navio.","Navegação, 2.3",null,null],["nav","O desvio da agulha magnética é causado principalmente:",["Pelo campo magnético da própria estrutura do navio e de sua carga","Pela diferença entre o Norte Verdadeiro e o Norte Magnético","Pela ação do vento e da corrente sobre o rumo da embarcação","Pela inclinação do eixo terrestre e pela latitude do local"],"Em um navio de aço, a estrutura e a carga criam um campo magnético que desvia a agulha. O desvio deve ser calculado com frequência.","Depende do navio, não do lugar.","Navegação, 2.3",null,null],["nav","Em 2000, a declinação magnética de um local era 22°30'W, com aumento de 10' ao ano. Em 2004 ela será:",["23°10'W","22°50'W","23°30'W","22°10'W"],"Em 4 anos a declinação aumenta 4 × 10' = 40'. Então 22°30' + 40' = 23°10'W.","Some a variação anual vezes o número de anos.","Navegação, 2.3 (exemplo adaptado)",null,null],["nav","A variação da agulha é o somatório algébrico da declinação magnética com o desvio da agulha. Se dmg = 18°W e dag = 2°E, a variação é:",["16°W","20°W","16°E","20°E"],"Quando a declinação e o desvio têm nomes contrários, subtraem-se: 18° − 2° = 16°W, com o nome da maior.","Mesmo nome soma, nomes contrários subtraem.","Navegação, 2.3",null,null],["nav","Se dmg = 17°W e dag = 1°W, a variação da agulha vale:",["18°W","16°W","18°E","17°W"],"Com mesmo nome somam-se os valores: 17° + 1° = 18°W.","Mesmo nome soma.","Navegação, 2.3",null,null],["nav","A marcação relativa é o ângulo entre:",["A proa da embarcação e o objeto, contado de 000° a 360° no sentido horário","O Norte Verdadeiro e o objeto, contado de 000° a 360° no sentido horário","O Norte Magnético e o objeto, contado de 000° a 360° no sentido horário","A proa da embarcação e o objeto, contado até 180° para cada bordo"],"Na marcação relativa o ângulo é contado a partir da proa, no sentido horário, de 000° a 360°.","Referência é a própria proa.","Navegação, 2.3",null,null],["nav","A marcação polar é contada a partir da proa:",["Para boreste e para bombordo, de 000° a 180°","Somente para boreste, de 000° a 360°, no sentido horário","Para boreste e bombordo, de 000° a 090° apenas, em cada bordo","Somente para bombordo, de 000° a 360°, no sentido anti-horário"],"Na marcação polar o ângulo é contado da proa para um dos bordos, de 000° a 180°, indicando BE ou BB.","Polar tem dois lados: boreste ou bombordo.","Navegação, 2.3",null,null],["nav","Para traçar o rumo entre dois pontos plotados na carta, utiliza-se a régua de paralelas levada até:",["A rosa dos ventos mais próxima","O compasso de navegação","A escala de longitudes","A isobática mais próxima"],"Une-se os pontos por uma reta, coloca-se a régua de paralelas sobre ela e leva-se até a rosa dos ventos para ler o rumo.","A rosa dos ventos tem os ângulos.","Navegação, 2.4",null,null],["nav","A agulha que fornece o Norte Verdadeiro e se baseia no princípio do giroscópio livre é a agulha:",["Giroscópica","Magnética","De marcar","De governo"],"A giroscópica usa a inércia giroscópica e a precessão para orientar o rotor para o meridiano geográfico (Norte Verdadeiro).","Giro de um rotor em alta velocidade.","Navegação, 2.6.2",null,null],["nav","A bordo, a agulha magnética é instalada o mais longe possível:",["Das influências dos ferros de bordo","Da proa e dos mastros, onde há maior movimento do casco","Do plano diametral, em um ponto no centro do convés","Da linha d'água, para evitar a umidade do mar"],"A agulha magnética fica no tijupá, o mais longe possível das influências dos ferros de bordo.","Ferro atrapalha agulha magnética.","Navegação, 2.6.1",null,null],["nav","Os requisitos essenciais de uma boa agulha magnética são:",["Sensibilidade e estabilidade","Velocidade e precisão","Potência e alcance","Leveza e resistência"],"A agulha deve indicar as variações de rumo (sensibilidade) e manter o rumo apesar dos movimentos do navio (estabilidade).","São dois substantivos com a mesma terminação.","Navegação, 2.6.1",null,null],["nav","O piloto automático é um aparelho que:",["Controla automaticamente o rumo, dispensando o timoneiro","Mede a profundidade do local a partir do fundo da embarcação","Mede a velocidade do vento real e o rumo aparente","Determina a posição da embarcação por satélites"],"O piloto automático mantém o navio no rumo sem timoneiro e ainda reduz o consumo de combustível e o desgaste da máquina do leme.","Governa o navio no lugar de uma pessoa.","Navegação, 2.6.3",null,null],["nav","O odômetro é o aparelho que indica:",["A distância percorrida","A profundidade do local","A velocidade do vento","A direção do Norte Verdadeiro"],"O odômetro indica a distância percorrida. Há o tipo Pitot (pressões) e o Doppler (variação de frequência).","Odômetro de carro mede quilômetros rodados.","Navegação, 2.6.4",null,null],["nav","O anemômetro é um instrumento utilizado para medir:",["A velocidade do vento","A velocidade do navio","A profundidade","A pressão da água"],"O anemômetro mede a velocidade do vento, em m/s, km/h, nós ou na escala de Beaufort (até a força 12).","Anemo é vento.","Navegação, 2.6.5",null,null],["nav","A palavra RADAR tem origem na expressão inglesa:",["Radio Detection And Ranging","Radar Direction And Range","Radio Direction And Rescue","Rapid Detection And Ranging"],"RADAR vem de Radio Detection And Ranging e usa a reflexão de ondas de rádio para detectar objetos.","Detecção e medição de distância por rádio.","Navegação, 2.6.6",null,null],["nav","Os radares usados na navegação marítima operam nas faixas de frequências:",["X e S","A e B","L e C","M e N"],"Os radares de navegação marítima operam nas faixas X e S.","São letras do fim do alfabeto.","Navegação, 2.6.6",null,null],["nav","Na apresentação em movimento relativo do radar, o navio aparece:",["Fixo no centro da tela, enquanto alvos e terra se movimentam","Em movimento, enquanto a terra e os alvos fixos permanecem parados","Sempre na borda da tela, enquanto a terra permanece parada","Alternando entre o centro e a borda, conforme a escala de distância"],"No movimento relativo, o nosso navio fica fixo no centro do PPI; alvos e terra se movem. No verdadeiro, navio e alvos se movem e a terra fica parada.","Relativo: tudo em relação a nós.","Navegação, 2.6.6",null,null],["nav","O ecobatímetro mede a profundidade a partir do fundo da embarcação. Para obter a profundidade do local, deve-se:",["Somar o calado da embarcação","Subtrair o calado da embarcação","Multiplicar pelo calado","Nada, pois a leitura já é a profundidade total"],"O eco é medido a partir do fundo do casco; somando-se o calado obtém-se a profundidade real do local.","O casco está mergulhado: falta contar esse trecho.","Navegação, 2.6.7",null,null],["nav","O sistema GPS é baseado em:",["24 satélites, com sinais disponíveis 24 horas em qualquer lugar do mundo","12 satélites geoestacionários, com cobertura apenas na faixa tropical","Estações radiogoniométricas em terra, com alcance de 200 milhas","6 satélites em órbita polar, com cobertura somente nos polos"],"O GPS usa 24 satélites em 6 órbitas a cerca de 20.200 km e não sofre interferência das condições atmosféricas locais.","O número do sistema é igual ao número de horas do dia.","Navegação, 2.6.8",null,null],["nav","No GPS, a sigla COG indica:",["Rumo no fundo, a direção realmente navegada","Velocidade no fundo, ao longo da derrota seguida","Hora estimada de chegada ao ponto de destino","Tecla de homem ao mar, com a posição atual do navio"],"COG é o rumo no fundo: a direção realmente navegada, resultante entre o rumo na superfície e a corrente.","COG vem de Course Over Ground.","Navegação, 2.6.8",null,null],["nav","A tecla MOB do GPS serve para:",["Marcar a posição atual e ir para ela em caso de homem ao mar","Mostrar a hora estimada de chegada ao próximo ponto da derrota","Informar a velocidade de avanço ao longo da derrota planejada","Cancelar o rumo programado e voltar ao ponto de partida"],"Ao acionar MOB, o GPS grava a posição atual e executa a função GO TO considerando esse ponto como destino.","MOB vem de Man Overboard.","Navegação, 2.6.8",null,null],["nav","As siglas ETA e ETD, no GPS, significam respectivamente:",["Hora estimada de chegada e hora estimada de partida","Hora estimada de partida e hora estimada de chegada","Rumo no fundo e rumo da agulha","Velocidade de avanço e velocidade no fundo"],"ETA é a hora estimada de chegada e ETD é a hora estimada de partida.","A (arrival) vem de chegada, D (departure) vem de partida.","Navegação, 2.6.8",null,null],["nav","O DGPS (GPS diferencial) é uma técnica em tempo real que:",["Corrige a maioria dos erros do GPS, usando estação de coordenadas conhecidas","Substitui os satélites do GPS por estações fixas instaladas ao longo da costa","Dispensa a carta náutica, plotando automaticamente a derrota do navio no mapa","Funciona somente em alto-mar, afastado de qualquer estação de controle em terra"],"O DGPS usa uma estação base de posição conhecida para corrigir os erros e chega à precisão de cerca de 5 m.","Diferencial corrige a diferença entre a posição conhecida e a medida.","Navegação, 2.6.8",null,null],["bal","O sistema de balizamento adotado no Brasil é o:",["IALA B","IALA A","IALA C","Sistema cardinal exclusivo"],"O material informa que o IALA B é o sistema adotado no Brasil, e que o IALA A é o usado nos Estados Unidos. A diferença básica é a inversão das cores das boias das margens.","A segunda letra do alfabeto.","Balizamento, 2.7.2",null,null],["bal","Ao entrar em um canal (sentido do alto-mar para o porto) no sistema IALA B, a boia encarnada deve ficar:",["A boreste da embarcação","A bombordo da embarcação","Por ante-a-ré do través","Sempre ao centro do canal"],"No IALA B, entrando no canal, a encarnada fica a boreste (BE) e a verde fica a bombordo (BB).","Encarnada à direita, verde à esquerda.","Balizamento, 2.7.3",null,null],["bal","Ao entrar em um canal pelo sistema IALA B, a boia verde fica:",["A bombordo","A boreste","À proa, no centro","Sempre à popa"],"A verde fica a bombordo (BB) na entrada do canal, no sistema IALA B.","Oposta à encarnada.","Balizamento, 2.7.3",null,null],["bal","Uma boia encarnada com uma faixa verde indica que o canal preferencial está:",["A bombordo dessa boia","A boreste dessa boia","Exatamente na vertical dela","Atrás dela, por ante-a-ré"],"Boia encarnada com faixa verde: canal preferencial a bombordo da boia. Boia verde com faixa encarnada: preferencial a boreste.","A faixa tem a cor do lado do canal preferencial.","Balizamento, 2.7.3",null,null],["bal","Uma boia verde com uma faixa encarnada indica que o canal preferencial está:",["A boreste dessa boia","A bombordo dessa boia","Ao norte dessa boia","Sempre ao sul dessa boia"],"Boia verde com faixa encarnada: canal preferencial a boreste da boia (luz de 2 + 1 lampejos verdes, se luminosa).","A faixa indica o lado oposto ao da cor principal.","Balizamento, 2.7.3",null,null],["bal","A boia de sinal cardinal Norte indica que as águas mais profundas estão:",["Ao norte do sinal","Ao sul do sinal","A leste do sinal","A oeste do sinal"],"O sinal cardinal Norte mostra o quadrante em que o navegante deve se manter e indica águas mais profundas ao norte do sinal.","Nome do sinal indica a direção das águas seguras.","Balizamento, 2.7.3",null,null],["bal","A marca de topo do sinal cardinal Norte, de dia, consiste em:",["Dois cones com os vértices para cima","Dois cones com os vértices para baixo","Dois cones unidos pelas bases","Dois cones unidos pelos vértices"],"Cardinal Norte: dois cones superpostos com os vértices para cima, com cores preto sobre amarelo.","Norte = para cima.","Balizamento, 2.7.3",null,null],["bal","A luz do sinal cardinal Leste exibe:",["3 lampejos brancos","6 lampejos brancos","9 lampejos brancos","Luz branca contínua"],"As luzes cardinais lembram um relógio: Norte contínuo, Leste 3 lampejos, Sul 6 lampejos e Oeste 9 lampejos.","Relógio: 3 horas é a direita (leste).","Balizamento, 2.7.3",null,null],["bal","A luz do sinal cardinal Sul exibe:",["6 lampejos brancos","3 lampejos brancos","9 lampejos brancos","2 lampejos brancos"],"Sul = 6 lampejos brancos (como o 6 no relógio).","Relógio: 6 horas é embaixo.","Balizamento, 2.7.3",null,null],["bal","A luz do sinal cardinal Oeste exibe:",["9 lampejos brancos","3 lampejos brancos","6 lampejos brancos","1 lampejo verde"],"Oeste = 9 lampejos brancos (como o 9 no relógio).","Relógio: 9 horas é à esquerda.","Balizamento, 2.7.3",null,null],["bal","A marca de topo do sinal cardinal Sul, de dia, é formada por:",["Dois cones pretos, com os vértices para baixo","Dois cones pretos, com os vértices para cima","Dois cones pretos, unidos pelas bases","Duas esferas pretas, uma sobre a outra"],"Cardinal Sul: dois cones com os vértices para baixo, corpo amarelo sobre preto (AP).","Sul = para baixo.","Balizamento, 2.7.3",null,null],["bal","A boia de perigo isolado exibe, de dia, como marca de topo:",["Duas esferas pretas, uma sobre a outra","Duas esferas encarnadas, uma sobre a outra","Dois cones pretos, unidos pelos vértices","Um cone verde, com o vértice para cima"],"Perigo isolado: duas esferas pretas superpostas; corpo preto com faixas encarnadas horizontais; à noite, 2 lampejos brancos por período.","Dois perigos, duas esferas.","Balizamento, 2.7.3",null,null],["bal","A boia de águas seguras apresenta, de dia, as cores:",["Branca com faixas encarnadas verticais","Preta com faixas encarnadas horizontais","Verde com faixa encarnada","Amarela com faixas pretas"],"Águas seguras: boia branca com faixas encarnadas verticais e, se houver, esfera encarnada. À noite, luz branca ou a letra A em Morse.","Listras na vertical significam água segura em volta.","Balizamento, 2.7.3",null,null],["bal","O balizamento é o conjunto de regras aplicadas aos sinais fixos e flutuantes que permitem ao navegante identificar:",["Os limites laterais dos canais, os perigos naturais e as obstruções","As profundidades dos canais e a posição dos faróis de setores","Somente as rotas de alto-mar e os esquemas de separação de tráfego","As correntes marítimas e a direção dos ventos predominantes"],"O balizamento marca limites laterais dos canais, perigos naturais, cascos soçobrados e outras obstruções.","Ajuda o navegante a saber por onde pode ir.","Balizamento, 2.7.1",null,null],["man","Na amarração padrão, a espia nº 1 (lançante de proa) tem a função de:",["Impedir que o navio caia a ré","Impedir que o navio caia avante","Impedir que o navio se afaste do cais","Impedir que o navio gire sobre a popa"],"O lançante de proa (espia nº 1) impede que o navio caia a ré.","Lançante de proa trabalha contra o movimento para trás.","Manobras, Espias",null,null],["man","A espia nº 4, chamada de través, serve para:",["Impedir que o navio se afaste do cais","Impedir que o navio caia a ré","Impedir que o navio caia avante","Ligar a amarra ao paiol"],"O través (espia nº 4) é lançado perpendicularmente ao cais e impede que o navio se afaste.","Fica no través, de lado.","Manobras, Espias",null,null],["man","A espia nº 2 é o espringue de proa. Ele impede que o navio:",["Caia avante","Caia a ré","Se afaste do cais","Vire de proa para o cais"],"Segundo o material, as espias 2, 5 e 7 impedem o caimento para vante. O espringue de proa é lançado da proa para a ré.","Lançado de vante para ré, segura o movimento para frente.","Manobras, Espias",null,null],["man","As espias nº 1, 3 e 6 (lançante de proa, lançante de bochecha e espringue de popa) impedem que a embarcação:",["Caia a ré","Caia avante","Se afaste do cais","Gire em torno do ferro"],"As espias 1, 3 e 6 impedem que a embarcação caia a ré. As 2, 5 e 7 impedem o caimento para vante e a 4 segura o afastamento do cais.","Compare com o grupo oposto: 2, 5 e 7.","Manobras, Amarração padrão",null,null],["man","Quando se passa uma espia adicional onde já existe outra, fazendo o mesmo caminho da primeira, diz-se que se:",["Dobra a amarração","Encapela a espia","Morde o cabo","Dá saltos"],"Dobrar a amarração é passar uma espia adicional, ou novas pernadas, fazendo o mesmo caminho das primeiras.","Duas espias onde havia uma.","Manobras, Fraseologia",null,null],["man","Diz-se que uma embarcação está atracada a contra-bordo quando suas espias são lançadas:",["A outra embarcação","Diretamente ao cais","Para a âncora de popa","Para uma boia de arinque"],"Atracado ao cais: espias para o cais. Atracado a contra-bordo: espias para outro navio.","Contra-bordo = bordo contra bordo.","Manobras, Fraseologia",null,null],["man","Na fraseologia de atracação, «brandear» um cabo significa:",["Folgar ou dar mais seio ao cabo","Exercer tração no cabo","Arrumar o cabo em aduchas","Passar o cabo por cima de outro"],"Brandear é folgar ou dar mais seio ao cabo. Alar é exercer tração e colher é arrumar em aduchas.","É o contrário de «alar».","Manobras, Fraseologia",null,null],["man","O cabrestante é um equipamento que:",["Trabalha com eixo vertical, movido elétrica ou mecanicamente, e ajuda na atracação","Trabalha com eixo horizontal, movido por motor elétrico, e serve para içar o ferro","Trabalha com eixo vertical, é movido manualmente e serve apenas para guardar cabos","É um equipamento de eixo inclinado, usado somente para içar a âncora do navio"],"O cabrestante tem eixo vertical, é elétrico ou mecânico e auxilia a manobra de espias. O molinete tem eixo horizontal e o sarilho é manual.","Cabrestante: vertical e com motor.","Manobras, Equipamentos",null,null],["man","O molinete é um eixo que trabalha:",["Na horizontal, movido elétrica ou mecanicamente, geralmente usado para içar o ferro","Na vertical, movido manualmente, usado apenas para guardar cabos e espias","Na vertical, movido elétrica ou mecanicamente, para auxiliar na atracação","Na horizontal, sem qualquer propulsão, usado somente para recolher as espias"],"O molinete tem eixo horizontal, é movido elétrica ou mecanicamente e é usado normalmente para içar (gurnir) o ferro.","Molinete fica na proa, junto às amarras.","Manobras, Equipamentos",null,null],["man","O sarilho é um eixo vertical utilizado geralmente para guardar cabo e que:",["Não tem propulsão e é movido manualmente","É movido eletricamente e trabalha na vertical, como o cabrestante","É movido a vapor, em eixo vertical, na proa","Trabalha na horizontal e é movido mecanicamente, como o molinete"],"O sarilho é vertical, sem propulsão, movido à mão, e serve geralmente para guardar cabo.","É o mais simples dos três.","Manobras, Equipamentos",null,null],["man","A ordem do comandante «Todo leme a boreste» significa carregar o leme a:",["25° para boreste","15° para boreste","30° para boreste","35° para boreste"],"«Todo leme» é carregar o leme a 25°. Só se chega a 30° com ordem expressa.","Fica abaixo de 30°.","Manobras, Vozes de manobra",null,null],["man","Se o comandante ordena «Leme a boreste» sem dizer o número de graus, o timoneiro deve:",["Atender com 15° e cantar a proa a cada 10°","Atender com 25° e cantar a proa a cada 5°","Atender com 5° e aguardar nova ordem","Carregar o leme todo"],"Quando não se especifica o ângulo, o timoneiro atende com 15° e vai cantando a proa a cada 10°.","Ordem sem número é a intermediária.","Manobras, Vozes de manobra",null,null],["man","A ordem «Leme a meio» significa:",["Marcar na rosa de manobra 000° ou 360°, deixando o leme na posição central","Carregar o leme 15° para um dos bordos e cantar a proa a cada 10°","Carregar o leme todo para o bordo oposto até a proa parar de guinar","Inverter o leme e informar quantos graus está carregado"],"Leme a meio é colocar o leme na posição central (000° ou 360° na rosa de manobra).","Posição central = zero.","Manobras, Vozes de manobra",null,null],["man","«Quebra a guinada» é a ordem para:",["Carregar o leme para o bordo oposto até a proa parar de guinar, depois trazê-lo a meio","Desfazer o leme gradativamente, cantando a proa a cada 10° de variação de rumo","Ler imediatamente o rumo da rosa de manobra e informá-lo ao comando do navio","Governar no rumo indicado, evitando sair dele para qualquer bordo da proa"],"Quebra a guinada é carregar o leme para o bordo oposto até parar a guinada, depois trazer a meio e cantar a proa.","Você precisa «quebrar» o giro da proa.","Manobras, Vozes de manobra",null,null],["man","«Marque a proa» é a ordem para o timoneiro:",["Ler imediatamente o rumo na rosa de manobra","Carregar o leme todo para o bordo indicado pelo comando","Governar no rumo indicado, evitando sair dele","Informar a tendência do leme para manter o rumo"],"Marque a proa: ler imediatamente o rumo da rosa de manobra.","Você deve dizer o rumo naquele instante.","Manobras, Vozes de manobra",null,null],["man","O timoneiro responde «A caminho» quando:",["Se firma no rumo indicado","Recebe ordem de leme a meio","O comandante manda inverter o leme","A proa está guinando"],"«A caminho» é a comunicação do timoneiro logo após se firmar no rumo indicado.","Significa que o navio já está em linha reta no rumo ordenado.","Manobras, Vozes de manobra",null,null],["man","A voz «Ciente» é dada:",["Somente por quem ordena a manobra, para tomar ciência de que a ordem foi cumprida","Pelo timoneiro, logo após se firmar no rumo indicado pelo comando da manobra","Pelo marinheiro de vigia, ao avistar qualquer perigo ou embarcação pela proa","Pelo prático, ao assumir o governo da embarcação na entrada do porto ou barra"],"«Ciente» só é dita por quem ordena a manobra, confirmando que tomou ciência do cumprimento da ordem.","Quem manda é quem fica «ciente».","Manobras, Vozes de manobra",null,null],["man","Um bom fundeadouro deve ser:",["Abrigado, com fundo de boa tensa e espaço para o giro do navio","Exposto a vento e correnteza, para que a âncora trabalhe melhor","De fundo de pedra lisa, que dá o melhor unhamento ao ferro","Muito profundo, para que o navio nunca encalhe durante o giro"],"O fundeadouro deve ser abrigado, sem correntes, ventos ou vagas fortes, com fundo de boa tensa, espaço para giro e não muito profundo.","Pense em segurança para a âncora agarrar e o navio girar.","Manobras, Fundeadouro",null,null],["man","São exemplos de fundo de boa tensa:",["Areia firme, lodo e lama","Pedra e coral","Pedra e areia solta","Cascalho solto"],"Areia firme, lodo e lama seguram bem. Fundos de pedra devem ser evitados: o unhamento é difícil e o ferro pode partir ou prender.","Fundos moles e firmes seguram a âncora.","Manobras, Fundeadouro",null,null],["man","Diz-se que o navio está «à garra» quando:",["É levado pelo vento ou pela maré, mesmo estando fundeado","Segue ao sabor da correnteza, sem que a âncora arraste no fundo","Está com o ferro a pique, isto é, com a amarra na vertical do escovém","Está fundeado com os dois ferros lançados, formando uma abertura"],"Navio à garra é o que arrasta a âncora, sendo levado pelo vento ou maré mesmo fundeado.","A âncora «garra» o fundo, mas não o segura.","Manobras, Suspender e fundear",null,null],["man","Quando a amarra está em direção perpendicular à superfície da água, diz-se que está:",["A pique","A pique de estai","Dizendo para vante","Dizendo para boreste"],"Amarra a pique é a que está na vertical. A pique de estai é quando está paralela ao estai de vante do mastro.","Pique = vertical.","Manobras, Amarras",null,null],["man","Os estais ou malhetes das amarras têm a finalidade de:",["Aumentar a resistência de cada elo e impedir a deformação dos demais","Diminuir o peso da amarra e facilitar sua estivagem no paiol","Indicar o número do quartel e auxiliar na contagem durante a noite","Facilitar a fixação da amarra ao paiol e ao gato de escape"],"Estais (malhetes) são travessões internos que aumentam a resistência do elo (cerca de 20% a mais) e evitam deformação sob esforço.","Reforço dentro do elo.","Manobras, Amarras",null,null],["man","A bóia de arinque é empregada para:",["Marcar o local em que foi lançado o ferro e facilitar sua recuperação se a amarra partir","Indicar a profundidade do fundeadouro e o comprimento da amarra arriada","Sinalizar o limite do canal preferencial reservado a navios fundeados","Prender o navio ao cais, como reforço das espias de través e de lançante"],"A bóia de arinque marca o local onde o ferro foi lançado e ajuda a recuperá-lo caso a amarra parta.","O arinque liga a boia ao ferro.","Manobras, Amarras",null,null],["man","Com o navio fundeado com um ferro no fundo, o outro ferro deve estar:",["Pronto para largar","Totalmente guardado no paiol","Desligado da amarra","Fora do escovém, em terra"],"Sempre que o navio estiver com o ferro no fundo, o outro tem que estar pronto para largar.","É uma questão de segurança.","Manobras, Suspender e fundear",null,null],["man","Na marcação das amarras, o elo de ligação pintado de branco serve para:",["Facilitar a contagem dos quartéis durante a noite","Indicar que a amarra está a pique, na posição vertical","Marcar o momento em que o ferro arranca do fundo","Sinalizar a profundidade máxima do fundeadouro aos vigias"],"Os elos de ligação são pintados de vermelho, branco e azul conforme a ordem do quartel. O branco facilita a contagem à noite.","É a cor que mais aparece no escuro.","Manobras, Marcação da amarra",null,null],["man","A manobra «fundeio a pé de galo» consiste em:",["Depois de fundeado o navio, largar o outro ferro","Fundear com o ferro na popa, mantendo o navio atravessado","Içar o ferro com o molinete, deixando-o a olho","Fundear somente em fundo de pedra, para maior unhamento"],"Fundeio a pé de galo é largar o segundo ferro depois de fundeado o navio.","São dois ferros em uso.","Manobras, Suspender e fundear",null,null],["com","Em um canal simplex de radiotelefonia, a frequência de transmissão e a de recepção são:",["A mesma, e só se pode falar ou ouvir de cada vez","Diferentes, e se pode falar e ouvir ao mesmo tempo","Diferentes, mas não é possível falar e ouvir ao mesmo tempo","Alternadas a cada minuto"],"Simplex: mesma frequência para transmitir e receber, de modo que só se fala ou ouve de cada vez.","Simples: uma só frequência.","Comunicações, 4.1",null,null],["com","No modo dúplex, as frequências de transmissão e de recepção são:",["Diferentes, permitindo falar e ouvir ao mesmo tempo","Iguais, permitindo falar e ouvir ao mesmo tempo","Iguais, sem permitir falar e ouvir ao mesmo tempo","Diferentes, sem permitir falar e ouvir ao mesmo tempo"],"No dúplex as frequências são diferentes e a transmissão e a recepção podem ocorrer simultaneamente, como no telefone.","Duas frequências, como em um telefone.","Comunicações, 4.1",null,null],["com","No modo semi-dúplex, as frequências de transmissão e recepção são:",["Diferentes, mas só se ouve a outra estação quando se termina de falar","Iguais, e se fala e ouve ao mesmo tempo, como no telefone","Diferentes, e se fala e ouve ao mesmo tempo, como no telefone","Iguais, e só se ouve após terminar de falar, usando um só canal"],"Semi-dúplex tem frequências diferentes, mas a transmissão e a recepção não são simultâneas.","Metade do dúplex: duas frequências, mas um por vez.","Comunicações, 4.1",null,null],["com","A faixa de VHF marítima vai de 156,025 MHz a 162,025 MHz, com potência média de:",["25 W","7 W","100 W","1 W"],"O VHF marítimo tem até 88 canais e potência média de 25 W. O alcance prático é de cerca de 50 milhas náuticas.","Não confunda com os 7 W da Faixa do Cidadão.","Comunicações, 4.2",null,null],["com","O alcance de um VHF marítimo depende principalmente:",["Da altura das antenas transmissora e receptora","Da hora do dia, pela reflexão das ondas na ionosfera","Do tamanho e do calado da embarcação que a transporta","Apenas da potência do aparelho transmissor, em qualquer condição"],"A onda do VHF é direta, não reflete na ionosfera. Por isso, devido à curvatura da Terra, o alcance depende da altura das antenas (cerca de 50 milhas na prática).","Antenas mais altas enxergam mais longe.","Comunicações, 4.2",null,null],["com","Em radiotelefonia VHF, a comunicação entre duas embarcações deve usar canais:",["Simplex","Dúplex","Somente do canal 70","Somente do canal 1"],"Canais dúplex são para comunicação entre embarcação e estação costeira. Entre embarcações use apenas simplex.","Embarcação-embarcação: sem estação costeira.","Comunicações, 4.2",null,null],["com","O canal 16 do VHF é o canal de:",["Chamada, escuta permanente e socorro e segurança","Comunicação rotineira entre embarcações e estações costeiras","Chamada seletiva digital e transmissão de dados da posição","Divulgação diária da previsão do tempo para a área marítima"],"O canal 16 é o canal de chamada, de escuta permanente e de socorro e segurança.","É o canal que todos devem escutar.","Comunicações, 4.2",null,null],["com","O canal 70 do VHF é destinado a:",["Chamada Seletiva Digital (DSC), sendo proibida a radiotelefonia","Comunicação em radiotelefonia entre embarcações, em rotina","Previsão do tempo da Marinha, em transmissão contínua","Comunicação de segurança entre embarcações, em radiotelefonia"],"No canal 70 é proibida a transmissão em radiotelefonia, pois ele é reservado para o DSC.","Não se fala nele.","Comunicações, 4.2",null,null],["com","O canal 13 do VHF é utilizado para:",["Comunicações de segurança entre embarcações","Socorro e chamada, em radiotelefonia, com escuta permanente","Comunicação com a RENEC para tráfego comercial","Chamada seletiva digital, com proibição da radiotelefonia"],"O canal 13 é usado para comunicações de segurança entre embarcações. O canal 6 também é usado entre embarcações.","13: segurança entre navios.","Comunicações, 4.2",null,null],["com","O transceptor SSB é indicado para embarcações que:",["Navegam fora do alcance do VHF, em média e longa distância","Navegam apenas em rios e lagos, a menos de 10 milhas da costa","Operam em portos, em comunicações de curtíssima distância","Usam somente o canal 16 do VHF, por estarem próximas à costa"],"O SSB opera em MF/HF, com ondas que refletem na ionosfera, e é indicado para média e longa distância (além de cerca de 50 milhas).","SSB vai mais longe que o VHF.","Comunicações, 4.3",null,null],["com","Em radiotelefonia SSB, as frequências de 2.182 kHz e 4.125 kHz são ao mesmo tempo frequências de:",["Escuta, chamada e socorro e segurança","Trabalho, para o tráfego de rotina entre estações","Previsão do tempo e avisos aos navegantes da área","Radioamador, para comunicações de caráter particular"],"2.182 kHz, 4.125 kHz e o canal 16 do VHF são frequências de escuta, chamada, socorro e segurança.","São as frequências «de emergência».","Comunicações, 4.5.4",null,null],["com","Na Faixa do Cidadão (PX), o canal 9 é restrito a:",["Mensagens referentes a situações de emergência","Chamada e escuta, sem tráfego de mensagens de rotina","Uso exclusivo em rodovias, para comunicação entre veículos","Comunicação entre embarcações, em canal de livre uso"],"No PX, o canal 9 é de emergência, o 11 é de chamada e escuta e o 19 é restrito ao uso em rodovias.","Sensação de 9 = emergência.","Comunicações, 4.4",null,null],["com","A Faixa do Cidadão, o radioamadorismo e a telefonia celular a bordo:",["Podem ser usados como meio auxiliar, mas não dispensam o VHF e o SSB","Substituem o VHF, desde que estejam licenciados pelo órgão competente","Substituem o SSB nas travessias, por terem maior alcance","São obrigatórios em todas as embarcações com mais de 12 metros"],"Esses meios são auxiliares e em hipótese alguma substituem o VHF e o SSB marítimos.","Auxiliar não é substituto.","Comunicações, 4.4",null,null],["com","A potência máxima permitida para os transceptores da Faixa do Cidadão (PX) é de:",["7 W","25 W","100 W","500 W"],"Segundo o material, a potência máxima de transmissão dos transceptores PX é de 7 W, com alcance de cerca de 30 km.","Menos que o VHF.","Comunicações, 4.4",null,null],["com","O Serviço Móvel Marítimo, realizado pela RENEC, NÃO realiza:",["Conversações telefônicas entre embarcações","Comunicações entre embarcação e terra","Recepção de chamadas de socorro","Transmissão de previsões meteorológicas"],"Por razões técnicas a RENEC não realiza conversações telefônicas entre embarcações; apenas eventualmente retransmite mensagens.","É um serviço embarcação-terra.","Comunicações, 4.5.1",null,null],["com","A União Internacional de Telecomunicações (UIT) tem sede em:",["Genebra, na Suíça","Londres, na Inglaterra","Nova York, nos Estados Unidos","Brasília, no Brasil"],"A UIT, agência da ONU com sede em Genebra, disciplina as comunicações e distribui frequências no mundo.","Cidade suíça.","Comunicações, 4.5.1 e 4.5.6",null,null],["com","A previsão do tempo prestada pela Marinha é dividida por áreas marítimas. A área ALFA vai de:",["Arroio Chuí a Cabo de Santa Marta","Cabo de Santa Marta a Cabo Frio, em águas costeiras","Cabo Frio a Caravelas, incluindo a costa do Espírito Santo","Salvador a Natal, incluindo a costa do Nordeste oriental"],"ALFA: Arroio Chuí a Cabo de Santa Marta. BRAVO e CHARLIE: Cabo de Santa Marta a Cabo Frio (oceânica e costeira). DELTA: Cabo Frio a Caravelas.","ALFA é a primeira letra e a área mais ao sul.","Comunicações, 4.5.2",null,null],["com","A área marítima DELTA corresponde ao trecho:",["Cabo Frio a Caravelas","Arroio Chuí a Cabo de Santa Marta","Natal a São Luís","São Luís a Cabo Orange"],"DELTA: Cabo Frio a Caravelas. FOXTROT: Salvador a Natal. GOLF: Natal a São Luís. HOTEL: São Luís a Cabo Orange.","Ordem alfabética ao longo da costa, de sul para norte.","Comunicações, 4.5.2",null,null],["com","Os serviços gratuitos da RENEC incluem:",["Avisos aos navegantes, previsão do tempo e recepção de chamadas de socorro, urgência e segurança","Telegramas e cartas radiomarítimas com assuntos sociais e correspondência privada","Radioteleimpressão (radiotelex) e ligações telefônicas particulares de longa distância","Todos os serviços comerciais de radiotelefonia e radiotelex, sem qualquer cobrança"],"São gratuitos: Aviso aos Navegantes (NX), Previsões (WX), recepção de informes meteorológicos e de chamadas de socorro, urgência e segurança. Telegramas e radiotelefonia são serviços comerciais taxados.","Segurança é gratuita; correspondência é cobrada.","Comunicações, 4.5.3",null,null],["com","As EPIRBs do sistema COSPAS-SARSAT operam na frequência de:",["406 MHz e/ou 121,5 MHz","1,6 GHz, via satélites geoestacionários do INMARSAT","9 GHz, faixa do radar de banda X","2.182 kHz, frequência de socorro em radiotelefonia"],"EPIRBs COSPAS-SARSAT usam 406 MHz e/ou 121,5 MHz, via satélites de órbita polar. As do INMARSAT operam em 1,6 GHz.","Frequências na faixa de centenas de MHz.","Comunicações, 4.5.7",null,null],["com","O SART (respondedor radar de busca e salvamento) opera na faixa de 9 GHz e, ao receber pulsos radar, aparece na tela do radar banda X na forma de:",["12 traços","3 pontos","1 círculo","2 linhas"],"O SART facilita localizar embarcações de sobrevivência e é visto no radar banda X como uma linha de 12 traços.","É um número de meses do ano.","Comunicações, 4.5.7",null,null],["com","Segundo o material, a licença de funcionamento da estação de rádio de bordo, quando se tem apenas um VHF, deve ser:",["Obtida na Diretoria Regional do Ministério das Comunicações, com validade de cinco anos","Dispensada para VHF e exigida somente para SSB, com validade de dez anos","Emitida somente pelo Comando da Marinha, com validade de dois anos, sem renovação","Válida por tempo indeterminado, emitida pela Capitania dos Portos de cada estado"],"Toda embarcação com estação-rádio, mesmo só com VHF, precisa de Licença de Funcionamento com validade de cinco anos. Esse é o órgão citado pelo material de estudo.","Mesmo um VHF exige licença.","Comunicações, 4.5.6",null,null],["com","Para operar uma estação radiotelefônica de bordo (VHF e/ou SSB), segundo o material, é necessário possuir:",["Certificado de Radioperador Restrito","Apenas a carteira de habilitação náutica","Licença de radioamador","Nenhuma habilitação específica"],"A estação de bordo só deve ser operada por quem tem Certificado de Radioperador Restrito.","Um certificado do operador.","Comunicações, 4.5.6",null,null],["com","A pena de suspensão da estação pode ser aplicada, entre outros casos, quando houver:",["Utilização das frequências de chamada e socorro para o tráfego de mensagens","Instalação do VHF sem a presença de um técnico credenciado a bordo","Falta de manutenção do cabo de antena e do equipamento de bordo","Uso do VHF em canal simplex para comunicação entre duas embarcações"],"Suspensão: criação de situação de perigo de vida, uso de equipamentos não aprovados e uso de frequências de chamada e socorro para tráfego de mensagens.","Chamada e socorro são para chamar, não para conversar.","Comunicações, 4.5.6",null,null],["com","As penalidades por infrações ao Serviço Móvel Marítimo, segundo o material, são:",["Multa, suspensão de até 30 dias e cassação","Apenas advertência verbal, sem multa nem suspensão","Prisão de até seis meses e multa em dinheiro","Multa e apreensão da embarcação até o pagamento"],"As penas são multa, suspensão de até 30 dias e cassação. Quando não se justificar pena, o infrator é advertido.","São três, em ordem crescente de gravidade.","Comunicações, 4.5.6",null,null],["com","Quanto à prioridade, a ordem das chamadas radiotelefônicas, da menor para a maior, é:",["Rotina, segurança, urgência, socorro","Socorro, urgência, segurança, rotina","Segurança, rotina, urgência, socorro","Rotina, urgência, segurança, socorro"],"A chamada de rotina tem a menor prioridade e a de socorro a maior. O socorro (MAYDAY) tem prioridade 1, urgência (PAN PAN) 2 e segurança (SÉCURITÉ) 3.","Quanto maior o risco, maior a prioridade.","Comunicações, 4.6.1",null,null],["com","O sinal de segurança em radiotelefonia, repetido três vezes antes da mensagem, é:",["SÉCURITÉ","PAN PAN","MAYDAY","SOS"],"SÉCURITÉ (pronuncia-se «securitê») precede mensagens sobre segurança da navegação ou avisos meteorológicos importantes.","Parece a palavra «segurança».","Comunicações, 4.6.1",null,null],["com","O sinal de urgência em radiotelefonia, que tem prioridade 2, é:",["PAN PAN","MAYDAY","SÉCURITÉ","QRT"],"PAN PAN (pronuncia-se «pane pane») indica urgência: segurança da embarcação ou de uma pessoa, como auxílio médico.","Só perde para o socorro.","Comunicações, 4.6.1",null,null],["com","A chamada MAYDAY indica que:",["A embarcação está sob ameaça de grave perigo e precisa de ajuda rápida","Há uma mensagem de segurança da navegação ou aviso meteorológico importante","Há uma mensagem de urgência, como pedido de auxílio médico","É uma chamada de rotina, iniciada no canal de chamada"],"MAYDAY é a chamada de socorro, prioridade máxima. Toda estação que a ouvir deve parar imediatamente qualquer transmissão que possa perturbá-la.","Pronuncia-se «meidei».","Comunicações, 4.6.1",null,null],["com","Uma estação que ouve um MAYDAY e pode prestar socorro deve transmitir:",["O «recibo»","Um SÉCURITÉ","Um PAN PAN","Um QRT"],"O «recibo» informa que ouviu o pedido de socorro e vai prestar ajuda; depois deve informar quando chegará ao local.","Confirme que recebeu.","Comunicações, 4.6.1",null,null],["com","Em uma chamada de rotina, a denominação da estação chamada deve ser repetida:",["No máximo três vezes","Exatamente cinco vezes","Somente uma vez","Dez vezes"],"A chamada de rotina é feita no canal de chamada, repetindo a denominação da estação chamada no máximo três vezes, seguida de «aqui», do indicativo e de «câmbio».","São poucas repetições.","Comunicações, 4.6.1",null,null],["com","A palavra «câmbio» em radiotelefonia é utilizada para:",["Indicar o fim da chamada ou mensagem, passando a vez à outra estação","Pedir à outra estação que repita a mensagem recebida","Encerrar definitivamente o contato, desligando a estação","Indicar que a mensagem seguinte é uma chamada de urgência"],"«Câmbio» indica o fim de uma chamada ou mensagem, passando a vez à outra estação.","Passa a palavra ao outro.","Comunicações, 4.6.1",null,null],["com","Depois de uma chamada no canal 16, as duas estações devem:",["Mudar para outro canal simplex, e ao fim retornar ao canal 16","Continuar a conversa no próprio canal 16, em voz baixa e pausada","Mudar para o canal 70 e ali concluir a comunicação","Mudar para um canal dúplex, reservado às estações costeiras"],"Chamada e resposta ocorrem no canal 16; a conversa segue em outro canal (por exemplo o 6) e, ao terminar, as estações retornam ao 16.","O canal 16 deve ficar livre.","Comunicações, 4.6.1",null,null],["com","No Código Q, QRA? pergunta:",["Qual o nome da sua estação?","Qual é a sua frequência exata?","Sofre interferência?","Qual é a sua localização?"],"QRA? = qual o nome da sua estação? QRG? = frequência exata. QRM? = interferência. QTH? = localização.","QRA vem de «nome».","Comunicações, 4.6.2",null,null],["com","No Código Q, QTH significa:",["Minha localização é...","Cesse a transmissão","Acuso recebimento","Tenho algo para você"],"QTH informa a localização, por denominação ou por latitude e longitude. QRT é «cesse a transmissão» e QSL é «acuso recebimento».","Pense em «onde estou».","Comunicações, 4.6.2",null,null],["com","No Código Q, QRT significa:",["Cesse a transmissão","Acuso recebimento","Sofro interferência","Minha frequência exata é..."],"QRT = cesse a transmissão. QRT? = devo cessar a transmissão?","T de terminar.","Comunicações, 4.6.2",null,null],["com","No Código Q, QSL significa:",["Acuso recebimento","Cesse a transmissão","Estou perturbado por estática","Qual é a sua localização"],"QSL = acuso recebimento; QSL? = pode acusar recebimento?","Confirma que recebeu.","Comunicações, 4.6.2",null,null],["com","No Código R, a indicação R5 significa:",["Sinal perfeitamente audível","Sinal inaudível","Audível com alguma dificuldade","Sinal pouco audível"],"R1 é inaudível, R3 audível com alguma dificuldade e R5 perfeitamente audível.","5 é o máximo da escala.","Comunicações, 4.6.2",null,null],["com","Pelo Alfabeto Fonético Internacional, as letras Q, W e X são, respectivamente:",["Quebec, Whiskey e X-Ray","Quilo, Waffle e Xerox","Quebec, Victor e Xavier","Quartz, Whiskey e X-Ray"],"Q = Quebec, W = Whiskey, X = X-Ray, Y = Yankee, Z = Zulu.","Fim do alfabeto: Yankee, Zulu.","Comunicações, 4.6.2",null,null],["com","Pelo Alfabeto Fonético Internacional, a letra M é:",["Mike","Maria","Metro","Mar"],"M = Mike. N = November, O = Oscar, P = Papa.","Nome de pessoa inglês.","Comunicações, 4.6.2",null,null],["com","Antes de utilizar um canal radiotelefônico, o operador deve:",["Ouvir o canal alguns segundos para não interferir em comunicação em andamento","Transmitir imediatamente, pois o canal de chamada está sempre livre","Mudar para o canal 70 antes de iniciar a chamada em qualquer situação","Chamar três vezes em voz alta, sem verificar se há estações no canal"],"Verifique se o canal está sendo usado por outras estações, escutando alguns segundos antes de transmitir.","Primeiro escute.","Comunicações, 4.6.3",null,null],["com","Na área A1 do GMDSS, a cobertura radiotelefônica é de pelo menos uma estação costeira em:",["VHF, com alerta DSC permanente, cerca de 20 a 30 milhas","MF, com alerta DSC permanente, cerca de 100 milhas da costa","INMARSAT, com alerta por satélite, entre 70°N e 70°S","HF, com alerta DSC permanente, em todo o planeta"],"A1: VHF com DSC, cerca de 20 a 30 milhas. A2: MF, cerca de 100 milhas. A3: INMARSAT, entre 70°N e 70°S. A4: o restante.","A1 é a mais próxima da costa.","Navegação, 2.8 (GMDSS)",null,null],["com","Segundo a Convenção SOLAS, o comandante de um navio no mar que recebe um sinal de perigo deve:",["Prosseguir a toda velocidade para o local para prestar auxílio","Continuar a rota e apenas informar o porto de destino","Aguardar instruções da empresa armadora antes de agir","Ignorar o sinal se não for o navio mais próximo do local"],"A SOLAS determina que o comandante prossiga a toda velocidade para o local do incidente a fim de prestar auxílio.","O socorro tem prioridade sobre a viagem.","Navegação, 2.8",null,null],["com","No VHF, o canal usado para tráfego de socorro e segurança por radiotelefonia é o:",["16","70","6","9"],"Canal 16 (156,800 MHz) é o de tráfego de socorro e segurança por radiotelefonia. O 70 é para DSC.","O canal de escuta permanente.","Navegação, 2.8",null,null],["gov","O RIPEAM-72 se aplica:",["A todas as embarcações em alto-mar e em águas a ele ligadas, navegáveis por navios de alto-mar","Somente a navios mercantes de comprimento igual ou superior a 100 metros, em viagem internacional","Somente a embarcações de recreio em águas interiores abrigadas, como lagos e baías fechadas","Somente à navegação interior, em rios e lagos de um mesmo país, sem acesso ao mar"],"A Regra 1 aplica o Regulamento a todas as embarcações em alto mar e águas ligadas navegáveis por navios de alto-mar, sem prejudicar regras especiais locais.","É geral: todas as embarcações.","RIPEAM, Regra 1",null,null],["gov","Segundo a Regra 2, uma embarcação pode se afastar das Regras quando necessário para:",["Evitar perigo imediato","Ganhar tempo na viagem","Economizar combustível","Atender uma preferência de porto"],"A Regra 2 admite o afastamento das Regras quando necessário para evitar perigo imediato, levando em conta os perigos e as limitações das embarcações.","Só se justifica por perigo imediato.","RIPEAM, Regra 2",null,null],["gov","Segundo o RIPEAM, o termo «embarcação a vela» designa a embarcação sob vela:",["Cuja máquina de propulsão, se houver, não esteja em uso","Que possui velas içadas, mesmo que a máquina esteja em uso","Que navega somente com vento de popa, sem uso de máquina","Com comprimento inferior a 12 metros e sem propulsão mecânica"],"A Regra 3(c) define embarcação a vela como a que está sob vela, desde que sua máquina, se houver, não esteja em uso. Com a máquina em uso, ela é de propulsão mecânica.","Se o motor está em uso, ela deixa de ser a vela.","RIPEAM, Regra 3",null,null],["gov","O termo «em movimento», para o RIPEAM, se aplica a todas as embarcações que:",["Não se encontram fundeadas, amarradas à terra ou encalhadas","Estão com a máquina em funcionamento, e não apenas fundeadas","Têm seguimento sobre a água, em relação ao fundo","Navegam fora de portos e de águas abrigadas"],"Em movimento é o estado de toda embarcação que não esteja fundeada, amarrada à terra ou encalhada, mesmo que esteja parada na água.","Basta não estar presa ao fundo ou à terra.","RIPEAM, Regra 3(i)",null,null],["gov","Pelo RIPEAM, duas embarcações estão «no visual» quando:",["Uma pode ser observada pela outra visualmente","As duas se detectam pelo radar","Uma escuta o sinal sonoro da outra","Estão a menos de 1 milha uma da outra"],"A Regra 3(k) diz que duas embarcações estão no visual quando uma pode ser observada visualmente pela outra. Só radar ou som não bastam.","É a visão, e não o radar.","RIPEAM, Regra 3(k)",null,null],["gov","A Regra 5 determina que toda embarcação mantenha, permanentemente:",["Vigilância apropriada, visual e auditiva, e por todos os meios adequados","Vigilância visual apenas durante a noite e em visibilidade restrita","Vigilância somente com radar, quando existente e operativo","Vigilância somente nos portos e canais de acesso"],"Toda embarcação deve manter permanentemente vigilância visual e auditiva e usar todos os meios apropriados para avaliar a situação e o risco de colisão.","É permanente.","RIPEAM, Regra 5",null,null],["gov","Entre os fatores a considerar na determinação da velocidade de segurança, por todas as embarcações, está:",["O grau de visibilidade","A potência do apito","A cor do casco","O número de tripulantes"],"A Regra 6 cita visibilidade, densidade do tráfego, capacidade de manobra, luzes à noite, vento, mar, correntes, perigos e calado.","Fator que muda com a neblina.","RIPEAM, Regra 6",null,null],["gov","Se a marcação de uma embarcação que se aproxima não se altera de modo apreciável, deve-se:",["Presumir que existe risco de abalroamento","Concluir que não há risco, pois a distância é constante","Aumentar a velocidade e manter o rumo, para passar pela proa dela","Soar um apito longo e manter o rumo e a velocidade"],"Pela Regra 7(d), marcação sem alteração apreciável leva a presumir risco de abalroamento. Em caso de dúvida, também se deve presumir que o risco existe.","Marcação constante e distância diminuindo.","RIPEAM, Regra 7",null,null],["gov","Em caso de dúvida sobre a existência de risco de abalroamento, a embarcação deve:",["Presumir que o risco existe","Presumir que o risco não existe","Aguardar a primeira manobra da outra","Reduzir para a velocidade mínima e emitir sinais luminosos"],"A Regra 7(a) manda presumir que o risco existe em caso de dúvida.","Na dúvida, prudência.","RIPEAM, Regra 7(a)",null,null],["gov","Ao manobrar para evitar abalroamento, a alteração de rumo e/ou velocidade deve ser:",["Ampla o bastante para ser clara para a outra embarcação, evitando pequenas alterações sucessivas","Feita com pequenas alterações sucessivas, para não alarmar a outra embarcação","Feita somente no último instante, para não perder tempo de navegação","Feita sem sinais e sem verificar a eficácia da manobra depois de concluída"],"Pela Regra 8(b), as alterações devem ser amplas e aparentes, evitando pequenas alterações sucessivas de rumo e/ou velocidade. A manobra deve ser positiva e antecipada.","A outra embarcação precisa perceber sua manobra.","RIPEAM, Regra 8",null,null],["gov","Para evitar um abalroamento ou ganhar tempo, a embarcação pode, se necessário:",["Diminuir a velocidade ou cortar seu seguimento, parando ou invertendo a propulsão","Apenas aumentar a velocidade, para passar na frente da outra embarcação","Apenas soar o apito longo e manter rumo e velocidade constantes","Fundear em qualquer local, mesmo em canal estreito ou esquema de tráfego"],"A Regra 8(e) autoriza reduzir a velocidade ou cortar o seguimento, parando ou invertendo os meios de propulsão.","Nem sempre mudar o rumo é a melhor saída.","RIPEAM, Regra 8(e)",null,null],["gov","Uma embarcação navegando ao longo de um canal estreito deve se manter:",["O mais próximo possível e seguro do limite exterior do canal que estiver a seu boreste","No centro do canal, para dar passagem às embarcações dos dois lados","O mais próximo possível do limite exterior do canal que estiver a seu bombordo","Na margem de menor profundidade, para dar espaço às demais embarcações do canal"],"Regra 9(a): manter-se tão próxima quanto possível e seguro do limite exterior do canal que estiver a seu boreste.","Mantenha-se à direita.","RIPEAM, Regra 9",null,null],["gov","Em um canal estreito, as embarcações de menos de 20 metros de comprimento ou a vela:",["Não devem interferir na passagem de embarcação que só possa navegar com segurança no canal","Têm preferência de passagem sobre embarcações maiores de propulsão mecânica no canal","Podem cruzar livremente à frente de qualquer navio, desde que soem um apito curto","São dispensadas do cumprimento das Regras de governo e manobra nesses locais"],"Regra 9(b): embarcações com menos de 20 m ou a vela não interferem na passagem de embarcação que só pode navegar com segurança no canal.","Quem tem mais liberdade de manobra cede.","RIPEAM, Regra 9(b)",null,null],["gov","Ao se aproximar de uma curva de canal estreito onde possa haver embarcações ocultas, a embarcação deve:",["Navegar com cuidado redobrado e soar um apito longo","Soar cinco apitos curtos e reduzir a velocidade ao mínimo","Soar três apitos curtos e dar atrás nas máquinas","Fundear imediatamente no meio do canal para aguardar"],"Regra 9(f) e 34(e): cuidado redobrado e um apito longo, que deve ser respondido por qualquer embarcação que o ouça do outro lado da curva.","Um apito longo avisa que alguém vai surgir.","RIPEAM, Regras 9(f) e 34(e)",null,null],["gov","Em um esquema de separação de tráfego, a embarcação que tem de cruzar uma via de tráfego deve fazê-lo:",["Tomando o rumo mais próximo possível da perpendicular à direção geral do fluxo","Em ângulo bem pequeno com a direção geral do fluxo de tráfego, para ganhar tempo","Paralelamente ao fluxo, acompanhando a via no mesmo sentido do tráfego","No sentido contrário ao do fluxo, pela margem de bombordo da via"],"Regra 10(c): evitar cruzar vias de tráfego, mas, se obrigada, cruzar no rumo mais próximo possível da perpendicular à direção geral do tráfego.","Cruzar o mais reto possível.","RIPEAM, Regra 10(c)",null,null],["gov","Duas embarcações a vela se aproximam com risco de abalroamento e recebem o vento por bordos diferentes. Deve se manter fora
