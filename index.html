function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){mem=db}}

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmtPct(x){var v=Math.round(x*1000)/10;return (v%1===0?String(v):v.toFixed(1)).replace('.',',')+'%'}
function plural(n,a,b){return n===1?a:b}
function fmtDate(t){try{var d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
var $app = document.getElementById('app'), $help = document.getElementById('help');

/* ---------- estado ---------- */
var S = db.session;           // sessão em andamento (prova salva) ou null
var view = 'home';
var ui = {count:10, filter:'all', confirming:false};

function newItems(qs){return qs.map(function(q){return {id:q.id,perm:shuffle([0,1,2,3]),ans:null,flag:false,hint:false,hOpen:false}})}

function drawExam(){
  var picked=[];
  ORDEM.forEach(function(t){
    var pool=QS.filter(function(q){return q.t===t}).map(function(q){var st=db.stats[q.id];return {q:q,k:(st?st.s:0)+Math.random()}});
    pool.sort(function(a,b){return a.k-b.k});
    pool.slice(0,MIX[t]).forEach(function(x){picked.push(x.q)});
  });
  return shuffle(picked);
}

function recordAnswer(q,ok){
  var st=db.stats[q.id]||{s:0,c:0,l:1};
  st.s++;if(ok)st.c++;st.l=ok?1:0;db.stats[q.id]=st;
}

function resultOf(s){
  var ok=0,blank=0,hints=0,byT={};
  s.items.forEach(function(it){
    var q=QMAP[it.id],b=byT[q.t]||(byT[q.t]={ok:0,n:0});
    b.n++;
    if(it.ans===null)blank++;else if(it.ans===0){ok++;b.ok++}
    if(it.hint)hints++;
  });
  var n=s.items.length;
  return {ok:ok,blank:blank,wrong:n-ok-blank,n:n,hints:hints,byT:byT,pct:n?ok/n:0};
}

function labelOf(s){return s.mode==='exam'?'Prova simulada':s.mode==='erros'?'Treino de erros':TEMAS[s.tema]}

function start(mode,qs,tema){
  S={mode:mode,tema:tema||null,items:newItems(qs),i:0,secs:0,done:false};
  ui.confirming=false;
  if(mode==='exam'){db.session=S;save()}
  go('quiz');
}

function finish(){
  var res=resultOf(S);S.done=true;S.res=res;
  if(S.mode==='exam'){
    S.items.forEach(function(it){if(it.ans!==null)recordAnswer(QMAP[it.id],it.ans===0)});
    db.session=null;
  }
  db.hist.unshift({t:Date.now(),mode:S.mode,label:labelOf(S),ok:res.ok,n:res.n,pct:res.pct,secs:S.secs,hints:res.hints});
  db.hist=db.hist.slice(0,30);
  save();ui.confirming=false;ui.filter='all';
  go('result');
}

/* ---------- navegação ---------- */
function go(v){view=v;render();window.scrollTo(0,0);var h=$app.querySelector('[data-focus]');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true})}catch(e){}}}

/* ---------- telas ---------- */
function themeStats(){
  var out={};ORDEM.forEach(function(t){out[t]={s:0,c:0,n:0}});
  QS.forEach(function(q){out[q.t].n++;var st=db.stats[q.id];if(st){out[q.t].s+=st.s;out[q.t].c+=st.c}});
  return out;
}
function barClass(p){return p>=MIN_PCT?'good':'low'}

function renderHome(){
  var ts=themeStats();
  var exams=db.hist.filter(function(h){return h.mode==='exam'});
  var best=exams.reduce(function(m,h){return Math.max(m,h.ok)},0);
  var avg=exams.length?exams.reduce(function(s,h){return s+h.pct},0)/exams.length:0;
  var errs=QS.filter(function(q){var st=db.stats[q.id];return st&&st.l===0}).length;
  var resume=db.session&&!db.session.done?db.session:null;
  var answered=resume?resume.items.filter(function(i){return i.ans!==null}).length:0;

  var h='';
  h+='<div class="topbar"><div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2"/><path d="M16 5l3.2 8.8L28 16l-8.8 2.2L16 27l-3.2-8.8L4 16l8.8-2.2z" fill="currentColor"/></svg><b>Simulado Náutico</b></div>'+
     '<button class="link" data-act="help">Ajuda</button></div>';

  h+='<section class="hero" aria-labelledby="hp"><span class="eyebrow">Prova simulada</span><h2 id="hp" data-focus>'+N_PROVA+' questões, como na prova</h2>'+
     '<p>Sorteadas dos oito temas do seu material, na proporção do conteúdo. Você responde sem ver o gabarito e recebe a nota no fim. Aprovação com '+Math.round(MIN_PCT*100)+'% ('+MIN_ACERTOS+' acertos).</p>'+
     '<div class="row">'+
     (resume?'<button class="btn light" data-act="resume">Continuar prova ('+answered+'/'+resume.items.length+')</button><button class="btn ghost" data-act="startExam">Começar outra</button>':
             '<button class="btn light" data-act="startExam">Iniciar prova</button>')+
     '</div></section>';

  if(exams.length){
    h+='<div class="stats" aria-label="Sua pontuação"><span>Provas feitas: <b>'+exams.length+'</b></span><span>Melhor nota: <b>'+best+'/'+N_PROVA+'</b></span><span>Média: <b>'+fmtPct(avg)+'</b></span></div>';
  }else{
    h+='<p class="note">Sua pontuação aparece aqui depois da primeira prova.</p>';
  }

  h+='<section><div class="sechead"><h2 class="sec">Estudar por tema</h2><div class="seg" role="group" aria-label="Quantidade de questões">'+
     [[10,'10'],[20,'20'],[0,'Todas']].map(function(o){return '<button data-act="setCount" data-n="'+o[0]+'" aria-pressed="'+(ui.count===o[0])+'">'+o[1]+'</button>'}).join('')+
     '</div></div><p class="note" style="margin:6px 0 12px">No estudo você vê a explicação logo após responder.</p><div class="list">';
  ORDEM.forEach(function(t){
    var x=ts[t],p=x.s?x.c/x.s:0;
    h+='<div class="row-t"><div style="min-width:0"><div class="nm">'+esc(TEMAS[t])+'</div><div class="sub">'+x.n+' questões · '+(x.s?'acerto '+fmtPct(p)+' em '+x.s+' '+plural(x.s,'resposta','respostas'):'ainda sem respostas')+'</div>'+
       (x.s?'<div class="bar" role="img" aria-label="Acerto '+fmtPct(p)+'"><i class="'+barClass(p)+'" style="width:'+Math.max(4,p*100)+'%"></i></div>':'')+
       '</div><button class="btn ghost small" data-act="startTema" data-t="'+t+'" aria-label="Estudar '+esc(TEMAS[t])+'">Estudar</button></div>';
  });
  if(errs){
    h+='<div class="row-t"><div><div class="nm">Treino de erros</div><div class="sub">'+errs+' '+plural(errs,'questão errada','questões erradas')+' na última vez</div></div><button class="btn ghost small" data-act="startErros">Treinar</button></div>';
  }
  h+='</div></section>';

  if(db.hist.length){
    h+='<section><h2 class="sec" style="margin-bottom:12px">Últimas sessões</h2><div class="list hist">'+
      db.hist.slice(0,6).map(function(x){
        var pass=x.mode==='exam'?(x.pct>=MIN_PCT?'<span class="pill ok">Aprovado</span>':'<span class="pill bad">Reprovado</span>'):'<span class="pill neutral">Estudo</span>';
        return '<div class="h"><div><b>'+esc(x.label)+'</b> '+pass+'</div><div><b>'+x.ok+'/'+x.n+'</b> · '+fmtPct(x.pct)+'</div><div class="when">'+fmtDate(x.t)+'</div><div class="when">'+(x.mode==='exam'?fmtTime(x.secs||0):'')+'</div></div>';
      }).join('')+'</div></section>';
  }
  h+='<p class="foot">Questões escritas a partir dos PDFs de estudo enviados (Regulamento Internacional para Evitar Abalroamentos no Mar, quadros do RIPEAM e Noções de Navegação, Manobra e Comunicações). Não são questões oficiais da prova.</p>';
  return h;
}

function renderQuiz(){
  var it=S.items[S.i],q=QMAP[it.id],exam=S.mode==='exam',n=S.items.length;
  var revealed=!exam&&it.ans!==null;
  var answered=S.items.filter(function(i){return i.ans!==null}).length;
  var h='<div class="topbar"><button class="link" data-act="leave">'+(exam?'Salvar e sair':'Sair')+'</button><button class="link" data-act="help">Ajuda</button></div>';

  if(ui.confirming&&exam){
    var blanks=[],flags=[];S.items.forEach(function(x,i){if(x.ans===null)blanks.push(i);if(x.flag)flags.push(i)});
    h+='<section class="confirm" aria-labelledby="cf"><h2 class="sec" id="cf" data-focus>Finalizar a prova?</h2>'+
       '<p>Você respondeu <b>'+answered+'</b> de '+n+' questões'+(blanks.length?'. Em branco valem zero.':'.')+'</p>'+
       (blanks.length?'<div><p class="note" style="margin-bottom:8px">Sem resposta:</p><div class="chips">'+blanks.map(function(i){return '<button data-act="goto" data-i="'+i+'" aria-label="Ir para a questão '+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div></div>':'')+
       (flags.length?'<div><p class="note" style="margin-bottom:8px">Marcadas para revisar:</p><div class="chips">'+flags.map(function(i){return '<button data-act="goto" data-i="'+i+'" aria-label="Ir para a questão '+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div></div>':'')+
       '<div class="row"><button class="btn" data-act="confirmFinish">Finalizar e ver a nota</button><button class="btn ghost" data-act="cancelFinish">Voltar à prova</button></div></section>';
    return h;
  }

  h+='<div class="qhead"><div class="c"><span class="eyebrow" data-focus>'+esc(labelOf(S))+'</span><span class="pos" aria-live="polite">'+(S.i+1)+'<span style="color:var(--muted)"> / '+n+'</span></span></div>'+
     (exam?'<span class="tm" aria-label="Tempo decorrido">Tempo <span id="timer">'+fmtTime(S.secs)+'</span></span>':'<span class="tm">'+answered+' '+plural(answered,'respondida','respondidas')+'</span>')+'</div>'+
     '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(S.i+1)+'"><i style="width:'+((S.i+1)/n*100)+'%"></i></div>';

  h+='<article class="qcard"><div><span class="chip">'+esc(TEMAS[q.t])+'</span></div><h2 class="qtext">'+esc(q.p)+'</h2>'+figure(q)+'<div class="opts" role="group" aria-label="Alternativas">';
  it.perm.forEach(function(orig,pos){
    var cls='opt',tag='';
    if(exam){if(it.ans===orig)cls+=' sel'}
    else if(revealed){if(orig===0){cls+=' right';tag='Correta'}else if(it.ans===orig){cls+=' wrong';tag='Sua resposta'}}
    h+='<button class="'+cls+'" data-act="pick" data-k="'+orig+'"'+(revealed?' disabled':'')+' aria-pressed="'+(exam&&it.ans===orig)+'"><span class="ltr">'+'ABCD'[pos]+'</span><span class="otx">'+esc(q.o[orig])+'</span>'+(tag?'<span class="otag">'+tag+'</span>':'')+'</button>';
  });
  h+='</div>';

  if(it.hOpen&&!revealed)h+='<div class="hintbox" role="note"><b>Dica</b>'+esc(q.h)+'</div>';
  if(revealed){
    var ok=it.ans===0;
    h+='<div class="fb '+(ok?'ok':'bad')+'" role="status"><strong>'+(ok?'Resposta correta':'Resposta incorreta')+'</strong><p>'+esc(q.e)+'</p><p class="ref">Fonte: '+esc(q.f)+'</p></div>';
  }
  if(!revealed){
    h+='<div class="tools"><button class="btn ghost small" data-act="hint" aria-pressed="'+it.hOpen+'">'+(it.hOpen?'Esconder dica':'Dica')+'</button>'+
       (exam?'<button class="btn ghost small" data-act="flag" aria-pressed="'+it.flag+'">'+(it.flag?'Marcada para revisar':'Marcar para revisar')+'</button>':'')+
       (exam&&it.ans!==null?'<button class="btn ghost small" data-act="clear">Limpar resposta</button>':'')+'</div>';
  }
  h+='</article>';

  var last=S.i===n-1;
  h+='<div class="nav"><button class="btn ghost" data-act="prev"'+(S.i===0?' disabled':'')+'>Anterior</button>'+
     (exam?(last?'<button class="btn" data-act="review">Revisar e finalizar</button>':'<button class="btn" data-act="next">Próxima</button>'):
           (last?'<button class="btn" data-act="finishStudy"'+(it.ans===null?' disabled':'')+'>Ver resultado</button>':'<button class="btn" data-act="next"'+(it.ans===null?' disabled':'')+'>Próxima</button>'))+'</div>';

  if(exam){
    h+='<details class="map"><summary>Mapa da prova ('+answered+'/'+n+' respondidas)</summary><div class="grid">'+
       S.items.map(function(x,i){return '<button class="'+(x.ans!==null?'a ':'')+(i===S.i?'cur ':'')+(x.flag?'f':'')+'" data-act="goto" data-i="'+i+'" aria-label="Questão '+(i+1)+(x.ans!==null?', respondida':', sem resposta')+(x.flag?', marcada':'')+'">'+(i+1)+'</button>'}).join('')+
       '</div><div class="legend"><span>Azul: respondida</span><span>Ponto âmbar: marcada para revisar</span></div></details>';
  }
  return h;
}

function renderResult(){
  var r=S.res,exam=S.mode==='exam',pass=r.pct>=MIN_PCT;
  var h='<div class="topbar"><button class="link" data-act="home">Início</button><button class="link" data-act="help">Ajuda</button></div>';
  h+='<section class="score" aria-labelledby="rs"><span class="eyebrow" id="rs" data-focus>Resultado · '+esc(labelOf(S))+'</span>'+
     '<div class="big"><span>'+r.ok+'</span><small>/ '+r.n+'</small></div>'+
     '<p class="pct">'+fmtPct(r.pct)+' de acertos '+(exam?(pass?'<span class="pill ok">Aprovado</span>':'<span class="pill bad">Reprovado</span>'):'')+'</p>'+
     '<p class="note">'+(exam?'Mínimo para aprovação neste simulado: '+MIN_ACERTOS+' acertos ('+Math.round(MIN_PCT*100)+'%). ':'')+
     'Erradas: '+r.wrong+(r.blank?' · Em branco: '+r.blank:'')+' · Dicas usadas em '+r.hints+' '+plural(r.hints,'questão','questões')+(exam?' · Tempo '+fmtTime(S.secs):'')+'</p></section>';
  h+='<section><h2 class="sec" style="margin-bottom:12px">Desempenho por tema</h2><div class="bars">';
  ORDEM.forEach(function(t){
    var b=r.byT[t];if(!b)return;var p=b.ok/b.n;
    h+='<div class="b"><span>'+esc(TEMAS[t])+'</span><span><b>'+b.ok+'/'+b.n+'</b> · '+fmtPct(p)+'</span><div class="bar" role="img" aria-label="'+fmtPct(p)+'"><i class="'+barClass(p)+'" style="width:'+Math.max(4,p*100)+'%"></i></div></div>';
  });
  h+='</div></section><div class="cta"><button class="btn" data-act="reviewAll">Revisar respostas</button>'+
     (exam?'<button class="btn ghost" data-act="startExam">Nova prova</button>':'<button class="btn ghost" data-act="home">Escolher outro tema</button>')+'</div>';
  return h;
}

function renderReview(){
  var items=S.items.map(function(it,i){var st=it.ans===null?'blank':it.ans===0?'ok':'wrong';return {it:it,i:i,q:QMAP[it.id],st:st}});
  var cnt={all:items.length,wrong:0,blank:0,flag:0};items.forEach(function(x){if(x.st==='wrong')cnt.wrong++;if(x.st==='blank')cnt.blank++;if(x.it.flag)cnt.flag++});
  var f=ui.filter;
  var list=items.filter(function(x){return f==='all'||(f==='wrong'&&x.st==='wrong')||(f==='blank'&&x.st==='blank')||(f==='flag'&&x.it.flag)});
  var h='<div class="topbar"><button class="link" data-act="backResult">Voltar ao resultado</button><button class="link" data-act="help">Ajuda</button></div>';
  h+='<h2 class="sec" data-focus>Revisão das respostas</h2><div class="seg" role="group" aria-label="Filtro" style="align-self:flex-start;flex-wrap:wrap">'+
     [['all','Todas'],['wrong','Erradas'],['blank','Em branco'],['flag','Marcadas']].map(function(o){return '<button data-act="filter" data-f="'+o[0]+'" aria-pressed="'+(f===o[0])+'">'+o[1]+' ('+cnt[o[0]]+')</button>'}).join('')+'</div>';
  if(!list.length)return h+'<div class="empty">Nenhuma questão neste filtro.</div>';
  h+='<div class="rv">'+list.map(function(x){
    var pill=x.st==='ok'?'<span class="pill ok">Certa</span>':x.st==='wrong'?'<span class="pill bad">Errada</span>':'<span class="pill neutral">Em branco</span>';
    return '<article class="rvi"><div class="top"><span class="n">Questão '+(x.i+1)+'</span>'+pill+'</div><span class="chip" style="align-self:flex-start">'+esc(TEMAS[x.q.t])+'</span><p class="qtext" style="font-size:17px">'+esc(x.q.p)+'</p>'+figure(x.q)+'<ul>'+
      x.it.perm.map(function(orig,pos){
        var cls='',tag='';
        if(orig===0){cls='right';tag='Correta'}else if(x.it.ans===orig){cls='wrong';tag='Sua resposta'}
        return '<li class="'+cls+'"><b>'+'ABCD'[pos]+'</b><span>'+esc(x.q.o[orig])+'</span>'+(tag?'<em>'+tag+'</em>':'')+'</li>';
      }).join('')+'</ul><p>'+esc(x.q.e)+'</p><p class="ref">Fonte: '+esc(x.q.f)+(x.it.hint?' · Dica usada':'')+'</p></article>';
  }).join('')+'</div>';
  return h;
}

function render(){
  var h=view==='home'?renderHome():view==='quiz'?renderQuiz():view==='result'?renderResult():renderReview();
  var fa=document.activeElement,sel=null;
  if(fa&&fa.dataset&&fa.dataset.act&&$app.contains(fa)){
    sel='[data-act="'+fa.dataset.act+'"]';
    ['k','i','f','n','t'].forEach(function(a){if(fa.dataset[a]!==undefined)sel+='[data-'+a+'="'+fa.dataset[a]+'"]'});
  }
  $app.innerHTML=h;
  if(sel){try{var el=$app.querySelector(sel);if(el&&!el.disabled)el.focus({preventScroll:true})}catch(e){}}
}

    '<h3>Modos</h3><ul><li><b>Prova simulada:</b> '+N_PROVA+' questões sorteadas dos oito temas. O gabarito só aparece no fim. Você pode voltar, trocar respostas e marcar questões para revisar.</li>'+
    '<li><b>Estudo por tema:</b> 10, 20 ou todas as questões do tema, com a explicação logo após cada resposta.</li>'+
    '<li><b>Treino de erros:</b> aparece depois que você erra alguma questão e reúne as erradas na última vez.</li></ul>'+
    '<h3>Botão Dica</h3><p>Mostra uma pista sem entregar a resposta. Na prova, o uso da dica é registrado e aparece no resultado, mas não tira pontos.</p>'+
    '<h3>Pontuação</h3><p>Cada acerto vale 1 ponto e questão em branco vale zero. A aprovação neste simulado é com '+Math.round(MIN_PCT*100)+'% ('+MIN_ACERTOS+' de '+N_PROVA+'). Esse critério foi definido aqui, então confirme o da sua prova.</p>'+
    '<h3>Teclado</h3><p><kbd>A</kbd> a <kbd>D</kbd> escolhem a alternativa, <kbd>←</kbd> e <kbd>→</kbd> trocam de questão.</p>'+
    '<h3>Seus dados</h3><p>A pontuação, o histórico e a prova em andamento ficam salvos apenas neste navegador.</p>'+
    '<h3>Sobre o conteúdo</h3><p>As questões foram escritas a partir dos três PDFs enviados. Trechos sobre comunicações (como EMBRATEL e Ministério das Comunicações) seguem o material e podem ter sido atualizados. Confira na norma vigente.</p>'+
    '<button class="btn" data-act="closeHelp">Entendi</button></div>';
  $help.hidden=false;

/* ---------- ações ---------- */
function cur(){return S.items[S.i]}
function persist(){if(S&&S.mode==='exam'&&!S.done){db.session=S;save()}}
var A={
  help:function(){openHelp(true)},
  closeHelp:function(){openHelp(false)},
  startExam:function(){start('exam',drawExam())},
  resume:function(){S=db.session;ui.confirming=false;go('quiz')},
  setCount:function(d){ui.count=+d.n;render()},
  startTema:function(d){
    var pool=shuffle(QS.filter(function(q){return q.t===d.t}));
    if(ui.count)pool=pool.slice(0,ui.count);
    start('tema',pool,d.t);
  },
  startErros:function(){
    var pool=QS.filter(function(q){var st=db.stats[q.id];return st&&st.l===0});
    start('erros',shuffle(pool).slice(0,20));
  },
  pick:function(d){
    var it=cur(),k=+d.k,q=QMAP[it.id];
    if(S.mode==='exam'){it.ans=(it.ans===k)?null:k;persist();render()}
    else if(it.ans===null){
      it.ans=k;recordAnswer(q,k===0);save();render();
      var nx=$app.querySelector('[data-act="next"],[data-act="finishStudy"]');if(nx){try{nx.focus({preventScroll:true})}catch(e){}}
    }
  },
  clear:function(){cur().ans=null;persist();render()},
  hint:function(){var it=cur();it.hOpen=!it.hOpen;if(it.hOpen)it.hint=true;persist();render()},
  flag:function(){var it=cur();it.flag=!it.flag;persist();render()},
  next:function(){if(S.i<S.items.length-1){S.i++;persist();go('quiz')}},
  prev:function(){if(S.i>0){S.i--;persist();go('quiz')}},
  goto:function(d){S.i=+d.i;ui.confirming=false;persist();go('quiz')},
  review:function(){ui.confirming=true;go('quiz')},
  cancelFinish:function(){ui.confirming=false;go('quiz')},
  confirmFinish:function(){finish()},
  finishStudy:function(){finish()},
  leave:function(){
    if(S.mode==='exam'){persist();go('home')}else{go('home')}
  },
  home:function(){go('home')},
  reviewAll:function(){ui.filter='all';go('review')},
  backResult:function(){go('result')},
  filter:function(d){ui.filter=d.f;render()}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=A[b.dataset.act];if(f){f(b.dataset,b)}
});
$help.addEventListener('click',function(e){if(e.target===$help)openHelp(false)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$help.hidden){openHelp(false);return}
  if(!$help.hidden||view!=='quiz'||!S||ui.confirming)return;
  var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SUMMARY'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),pos='abcd'.indexOf(k);if(pos<0&&'1234'.indexOf(k)>=0&&k.length===1)pos='1234'.indexOf(k);
  if(pos>=0){var orig=cur().perm[pos];A.pick({k:orig});return}
  if(e.key==='ArrowRight'){if(S.mode==='exam'||cur().ans!==null)A.next()}
  else if(e.key==='ArrowLeft')A.prev();
});
setInterval(function(){
  if(view==='quiz'&&S&&S.mode==='exam'&&!S.done&&!ui.confirming&&!document.hidden){
    S.secs++;var el=document.getElementById('timer');if(el)el.textContent=fmtTime(S.secs);
    if(S.secs%15===0)persist();
  }
},1000);

render();
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
