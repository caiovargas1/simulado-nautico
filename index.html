do caminho a que recebe o vento:",["Por bombordo","Por boreste","Pela popa","De barlavento"],"Regra 12(a)(I): com vento de bordos diferentes, a embarcação que recebe o vento por bombordo se mantém fora do caminho da outra.","Vento por bombordo: cede.","RIPEAM, Regra 12",null,null],["gov","Duas embarcações a vela recebem o vento do mesmo bordo. Deve se manter fora do caminho a que estiver:",["A barlavento","A sotavento","À frente","Com maior comprimento"],"Regra 12(a)(II): com o vento do mesmo bordo, a embarcação a barlavento se mantém fora do caminho da que estiver a sotavento.","Barlavento é o lado de onde vem o vento.","RIPEAM, Regra 12",null,null],["gov","Uma embarcação é considerada «alcançando» outra quando se aproxima vinda de uma direção:",["De mais de 22,5° para ré do través da alcançada","De até 22,5° para ré do través da alcançada","Por ante-a-vante do través da outra embarcação","Exatamente pela proa da outra embarcação, em rumos opostos"],"Regra 13(b): alcança quem se aproxima de mais de 22,5° para ré do través; à noite só veria a luz de alcançado (popa) da outra.","À noite, só veria a luz de popa.","RIPEAM, Regra 13",null,null],["gov","Na ultrapassagem, a embarcação que ultrapassa deve:",["Manter-se fora do caminho da embarcação ultrapassada","Manter rumo e velocidade, por ter preferência na passagem","Ter preferência de passagem sobre a ultrapassada","Guinar sempre para boreste, qualquer que seja a situação"],"Regra 13(a): toda embarcação que esteja ultrapassando outra deve manter-se fora do caminho dela, até ultrapassá-la inteiramente e ficar afastada.","Quem alcança é quem cede.","RIPEAM, Regra 13",null,null],["gov","Na dúvida sobre se uma embarcação está alcançando outra, ela deve:",["Considerar a situação como ultrapassagem e manobrar de acordo","Considerar-se embarcação que tem preferência e manter o rumo","Considerar a situação como rumos cruzados e manobrar","Soar três apitos curtos e manter rumo e velocidade"],"Regra 13(c): havendo dúvida, considerar a situação como ultrapassagem e manobrar de acordo.","Na dúvida, você é quem alcança.","RIPEAM, Regra 13(c)",null,null],["gov","Duas embarcações de propulsão mecânica se aproximam em rumos diretamente opostos, com risco de abalroamento. Cada uma deve:",["Guinar para boreste, passando bombordo com bombordo","Guinar para bombordo, passando boreste com boreste","Manter o rumo, e a maior reduz a velocidade","Parar as máquinas e soar um apito longo"],"Regra 14(a): na situação de roda a roda, cada uma guina para boreste, de modo que a passagem se dê por bombordo uma da outra.","Ambas à direita.","RIPEAM, Regra 14",null,null],["gov","Em rumos cruzados, duas embarcações de propulsão mecânica com risco de abalroamento: deve se manter fora do caminho a embarcação que:",["Avista a outra por boreste","Avista a outra por bombordo","É a maior","É a mais veloz"],"Regra 15: a embarcação que avista a outra por boreste se mantém fora do caminho dela e, se possível, evita cruzar sua proa.","Quem vê a outra à direita cede.","RIPEAM, Regra 15",null,null],["gov","À noite, em situação de rumos cruzados com risco de abalroamento, você avista por boreste a luz encarnada de outra embarcação de propulsão mecânica. Você deve:",["Manter-se fora do caminho dela, manobrando antecipada e substancialmente","Manter rumo e velocidade, pois tem preferência sobre a outra","Guinar para bombordo, cruzando pela proa da outra embarcação","Parar as máquinas e aguardar sinal sonoro da outra embarcação"],"A outra está por seu boreste, então você é a obrigada a manobrar (Regras 15 e 16), preferencialmente passando por sua popa.","A outra está à sua direita.","RIPEAM, Regras 15 e 16, e Manobras (Rumos Cruzados)",null,null],["gov","Na situação de rumos cruzados, a embarcação obrigada a manobrar deve, se as circunstâncias permitirem, evitar:",["Cruzar a proa da outra","Cruzar a popa da outra","Reduzir a velocidade","Soar um apito curto"],"A Regra 15 diz que a embarcação que deve manobrar evitará, se possível, cruzar a proa da outra, passando por sua popa.","Passar pela proa é arriscado.","RIPEAM, Regra 15",null,null],["gov","A embarcação que tem preferência (a que deve manter rumo e velocidade) pode manobrar quando:",["Lhe pareça que a obrigada a manobrar não está manobrando apropriadamente","Quando a outra soar um apito curto, indicando guinada para boreste","Quando quiser trocar de rumo livremente, sem relação com a outra","Quando estiver em visibilidade restrita, em qualquer situação"],"Regra 17(a)(II): ela pode manobrar tão logo lhe pareça que a outra não está manobrando de forma apropriada. Se o abalroamento não puder ser evitado só pela manobra da outra, deve manobrar da melhor maneira (17(b)).","Ela pode agir, mas só quando a outra falha.","RIPEAM, Regra 17",null,null],["gov","Em situação de rumos cruzados, a embarcação de propulsão mecânica que tem preferência e precisa manobrar não deve, se as condições permitirem:",["Guinar para bombordo para outra embarcação que esteja a seu bombordo","Guinar para boreste, afastando-se da embarcação do lado oposto","Reduzir a velocidade, se as condições do caso o permitirem","Soar sinais de manobra, indicando a guinada para a outra"],"Regra 17(c): ela não deve, se possível, guinar para bombordo para embarcação que se encontre a seu bombordo.","Guinar para o lado da outra a aproxima.","RIPEAM, Regra 17(c)",null,null],["gov","Uma embarcação de propulsão mecânica em movimento deve se manter fora do caminho de:",["Embarcação sem governo, com capacidade de manobra restrita, engajada na pesca ou a vela","Somente de embarcação sem governo e de embarcação a vela, em qualquer situação","Somente de embarcação a vela e de embarcação engajada na pesca, em qualquer situação","Embarcação de comprimento maior que o seu, em qualquer caso de manobra"],"Regra 18(a): propulsão mecânica se mantém fora do caminho de sem governo, capacidade restrita, engajada na pesca e a vela.","Hierarquia: o que tem menos liberdade de manobra tem preferência.","RIPEAM, Regra 18",null,null],["gov","Uma embarcação a vela em movimento deve se manter fora do caminho de:",["Embarcação sem governo, com capacidade de manobra restrita ou engajada na pesca","Embarcação de propulsão mecânica em movimento, de qualquer tamanho ou porte","Embarcação a remo e embarcação de propulsão mecânica em movimento","Qualquer embarcação de comprimento maior que o seu, mesmo a vela"],"Regra 18(b): a vela cede a sem governo, capacidade restrita e pesca. A embarcação de propulsão mecânica é quem cede à vela.","A vela tem preferência sobre a motor.","RIPEAM, Regra 18",null,null],["gov","Uma embarcação engajada na pesca, em movimento, deve, tanto quanto possível, manter-se afastada do caminho de:",["Embarcação sem governo e embarcação com capacidade de manobra restrita","Embarcação a vela e embarcação engajada na pesca de arrasto em qualquer área","Embarcação de propulsão mecânica e embarcação a vela em movimento","Qualquer outra embarcação, em qualquer situação de navegação"],"Regra 18(c): a embarcação de pesca se mantém afastada de sem governo e de capacidade de manobra restrita.","Só dois tipos têm preferência sobre ela.","RIPEAM, Regra 18(c)",null,null],["gov","Em visibilidade restrita, uma embarcação de propulsão mecânica deve:",["Seguir em velocidade segura e ter as máquinas prontas para manobra imediata","Manter a velocidade de cruzeiro e confiar apenas no radar para evitar abalroamentos","Navegar com as máquinas paradas até que a visibilidade melhore, em qualquer caso","Fundear onde estiver, mesmo em canal estreito ou esquema de separação de tráfego"],"Regra 19(b): toda embarcação segue em velocidade segura adaptada à visibilidade; as de propulsão mecânica mantêm as máquinas prontas para manobra imediata.","Máquinas prontas para atender.","RIPEAM, Regra 19",null,null],["gov","A Regra 19 (visibilidade restrita) se aplica a embarcações:",["Fora do visual uma da outra, navegando dentro ou próximo de área de visibilidade restrita","No visual uma da outra, navegando em qualquer condição de visibilidade ou área","Somente em portos e águas interiores, em qualquer condição de visibilidade","Somente de propulsão mecânica, fora do visual uma da outra, em alto-mar"],"Regra 19(a): aplica-se a embarcações fora do visual uma da outra, dentro ou próximo de área de visibilidade restrita.","Não se enxergam.","RIPEAM, Regra 19(a)",null,null],["gov","Em visibilidade restrita, uma embarcação que ouve o sinal de cerração de outra aparentemente por ante-a-vante do seu través, sem ter determinado que não há risco, deve:",["Reduzir a velocidade ao mínimo que permita manter o rumo e, se necessário, cortar o seguimento","Aumentar a velocidade para passar logo pela outra embarcação e sair do nevoeiro","Guinar para bombordo e manter a velocidade de cruzeiro do navio, sem sinais","Fundear imediatamente, mesmo em canal estreito ou via de tráfego intenso"],"Regra 19(e): reduzir a velocidade ao mínimo para manter o rumo, retirar todo o seguimento se necessário, e navegar com extrema cautela até passar o perigo.","Ouviu à frente: modere.","RIPEAM, Regra 19(e)",null,null],["gov","Uma embarcação detecta outra apenas pelo radar e precisa mudar de rumo. Deve evitar, se possível:",["Alterar o rumo para bombordo, para embarcação por ante-a-vante do través, exceto se esta for alcançada","Alterar o rumo para boreste, para embarcação por ante-a-vante do través, em qualquer caso","Reduzir a velocidade, para embarcação por ante-a-vante do través, em qualquer caso","Parar as máquinas, para embarcação por ante-a-ré do través, em qualquer caso"],"Regra 19(d): evitar alteração para bombordo para embarcação por ante-a-vante do través (exceto em ultrapassagem) e mudança de rumo na direção de embarcação no través ou por ante-a-ré do través.","Evite guinar para a esquerda para alvo na frente.","RIPEAM, Regra 19(d)",null,null],["luz","As Regras referentes às luzes se aplicam:",["Do pôr ao nascer do Sol","Apenas durante a noite escura","Somente em visibilidade restrita","Apenas em alto-mar"],"Regra 20(b): as regras de luzes se aplicam do pôr ao nascer do Sol. As marcas se aplicam ao período diurno.","É o período em que há sol e não há sol.","RIPEAM, Regra 20",null,null],["luz","As luzes prescritas pelas Regras, se instaladas, também devem ser exibidas:",["Entre o nascer e o pôr do Sol em visibilidade restrita","Somente à noite, entre o pôr e o nascer do Sol","Somente em portos, fundeadouros e canais estreitos","Apenas quando a embarcação estiver em movimento, de dia"],"Regra 20(c): as luzes, se instaladas, também são exibidas de dia em visibilidade restrita.","Neblina de dia também pede luzes.","RIPEAM, Regra 20(c)",null,null],["luz","A «luz de mastro» é uma luz:",["Branca contínua, sobre o eixo longitudinal, visível em um setor de 225°","Branca contínua, sobre o eixo longitudinal, visível em um setor de 135°","Verde e encarnada, em setores de 112,5° cada, nos dois bordos","Amarela contínua, sobre o eixo longitudinal, visível em 135°"],"Luz de mastro: branca, sobre o eixo longitudinal, setor de 225°, da proa até 22,5° para ré do través em cada bordo.","É o setor mais largo de todas as luzes de navegação.","RIPEAM, Regra 21(a)",null,null],["luz","As luzes de bordos são visíveis em um setor horizontal de:",["112,5° cada, da proa até 22,5° para ré do través","225° cada, da proa até a popa em cada bordo","135° cada, centrados na popa da embarcação","360° cada, visíveis em todo o horizonte"],"Regra 21(b): luz verde a boreste e encarnada a bombordo, cada uma em 112,5° da proa até 22,5° para ré do través do seu bordo.","As duas juntas somam 225°, como a luz de mastro.","RIPEAM, Regra 21(b)",null,null],["luz","A luz de alcançado é uma luz:",["Branca contínua, situada o mais próximo possível da popa, visível em 135°","Branca contínua, situada junto ao tope do mastro, visível em 225°","Amarela contínua, situada o mais próximo possível da popa, visível em 360°","Verde contínua, situada a vante, visível em 112,5°"],"Regra 21(c): luz branca de popa, setor de 135° (67,5° para cada bordo a partir da popa). A luz de reboque é amarela com as mesmas características.","Fica na popa e é branca.","RIPEAM, Regra 21(c)",null,null],["luz","A «luz de reboque» é uma luz:",["Amarela, com as mesmas características da luz de alcançado","Branca, com as mesmas características da luz de mastro","Encarnada, circular, visível em todo o horizonte","Verde, circular, visível em todo o horizonte"],"Regra 21(d): luz de reboque é amarela e tem as mesmas características da luz de alcançado (setor de 135°).","Amarela, na popa.","RIPEAM, Regra 21(d)",null,null],["luz","Uma luz circular é aquela visível em um arco de horizonte de:",["360°","225°","135°","112,5°"],"Regra 21(e): luz circular é a luz contínua visível em arco de horizonte de 360°.","Círculo completo.","RIPEAM, Regra 21(e)",null,null],["luz","Uma embarcação de propulsão mecânica com comprimento igual ou superior a 50 metros deve ter como alcance mínimo da luz de mastro:",["6 milhas","5 milhas","3 milhas","2 milhas"],"Regra 22(a): mastro 6 milhas; bordos, alcançado, reboque e circular 3 milhas (para 50 m ou mais).","Quanto maior a embarcação, maior o alcance.","RIPEAM, Regra 22(a)",null,null],["luz","Em uma embarcação de 12 metros ou mais e menos de 20 metros, o alcance mínimo da luz de mastro é de:",["3 milhas","6 milhas","5 milhas","2 milhas"],"Regra 22(b): de 12 a 50 m, o mastro tem 5 milhas, mas quando o comprimento é inferior a 20 m, 3 milhas.","Exceção da faixa de menos de 20 m.","RIPEAM, Regra 22(b)",null,null],["luz","Em embarcações com menos de 12 metros, os alcances mínimos são:",["Luz de mastro 2 milhas e luzes de bordos 1 milha","Luz de mastro 6 milhas e bordos 3 milhas","Luz de mastro 5 milhas e bordos 2 milhas","Luz de mastro 3 milhas e bordos 3 milhas"],"Regra 22(c): para menos de 12 m, mastro 2 milhas, bordos 1 milha, alcançado 2 milhas, reboque 2 milhas e circular 2 milhas.","São os menores alcances da regra.","RIPEAM, Regra 22(c)",null,null],["luz","Uma embarcação de propulsão mecânica em movimento, de comprimento igual ou superior a 50 m, deve exibir:",["Duas luzes de mastro (a de ré mais alta), luzes de bordos e luz de alcançado","Apenas uma luz circular branca, de mastro, e luzes de bordos, sem luz de popa","Duas luzes circulares encarnadas em linha vertical e luz de alcançado","Luz de mastro, luz de alcançado e luz de reboque amarela, sem luzes de bordos"],"Regra 23(a): luz de mastro a vante, segunda luz de mastro a ré e mais alta, luzes de bordos e luz de alcançado.","Duas de mastro, uma de cada cor de bordo e uma de popa.","RIPEAM, Regra 23(a)",null,null],["luz","A segunda luz de mastro (a de ré) de uma embarcação de propulsão mecânica:",["É opcional em embarcações com menos de 50 metros","É obrigatória em qualquer embarcação","Deve ser mais baixa que a de vante","É proibida em embarcações menores de 50 m"],"Regra 23(a)(II): embarcação com comprimento inferior a 50 metros não é obrigada a exibir a segunda luz de mastro, mas pode fazê-lo.","O limite é 50 m.","RIPEAM, Regra 23(a)",null,null],["luz","Uma embarcação de propulsão mecânica com menos de 12 metros pode exibir, em vez das luzes normais:",["Uma luz circular branca e luzes de bordos","Duas luzes de mastro e luz de reboque","Somente luz de alcançado","Duas luzes circulares encarnadas"],"Regra 23(d)(I): menos de 12 m pode exibir uma luz circular branca e luzes de bordos. Com menos de 7 m e velocidade máxima de até 7 nós, basta a luz circular branca (e luzes de bordos, se possível).","Simplificação para embarcações pequenas.","RIPEAM, Regra 23(d)",null,null],["luz","Em embarcações com menos de 20 metros, as luzes de bordos podem ser:",["Combinadas em uma única lanterna sobre o eixo longitudinal","Dispensadas totalmente, se houver luz de mastro","Substituídas por uma luz amarela circular no tope do mastro","Substituídas por uma única luz circular encarnada à proa"],"Regra 21(b): em embarcações com menos de 20 m, as luzes de bordos podem ser combinadas em uma única lanterna sobre o eixo longitudinal.","Uma lanterna, duas cores.","RIPEAM, Regra 21(b)",null,null],["luz","Uma embarcação de propulsão mecânica rebocando, com comprimento de reboque inferior a 200 m, deve exibir:",["Duas luzes de mastro em linha vertical, luzes de bordos, luz de alcançado e luz de reboque","Três luzes de mastro em linha vertical, bordos, alcançado e luz de reboque","Uma luz de mastro, luzes de bordos, alcançado e uma luz circular amarela no tope","Duas luzes circulares em linha vertical, verde sobre branca, e luzes de bordos"],"Regra 24(a): duas luzes de mastro em linha vertical (três se o reboque passar de 200 m), bordos, alcançado e luz de reboque amarela acima da luz de alcançado.","Mais uma luz de mastro que o normal.","RIPEAM, Regra 24(a)",null,null],["luz","Quando o comprimento do reboque, medido da popa do rebocador à popa do rebocado, é superior a 200 m, o rebocador exibe:",["Três luzes de mastro em linha vertical e um losango onde melhor possa ser visto","Duas luzes de mastro em linha vertical e um cilindro onde melhor possa ser visto","Uma luz de mastro, duas circulares encarnadas e um losango","Duas esferas em linha vertical e luz de reboque amarela"],"Regra 24(a): com reboque acima de 200 m, três luzes de mastro em linha vertical e uma marca em forma de losango (de dia).","Reboque longo: mais uma luz de mastro.","RIPEAM, Regra 24(a)",null,null],["luz","Uma embarcação empurradora e uma empurrada rigidamente ligadas, formando unidade integrada, exibem:",["As luzes de uma única embarcação de propulsão mecânica (Regra 23)","As luzes de uma embarcação rebocando, com duas luzes de mastro em linha vertical","Duas luzes circulares encarnadas em linha vertical, como a embarcação sem governo","Somente uma luz circular branca e luzes de bordos"],"Regra 24(b): empurradora e empurrada formando unidade integrada são consideradas uma só embarcação de propulsão mecânica.","Unidade integrada = uma só embarcação.","RIPEAM, Regra 24(b)",null,null],["luz","Uma embarcação a vela em movimento deve exibir:",["Luzes de bordos e luz de alcançado","Luz de mastro e luzes de bordos","Duas luzes circulares encarnadas","Apenas uma luz circular branca"],"Regra 25(a): luzes de bordos e luz de alcançado. Não exibe luz de mastro.","Veleiro não usa luz de mastro de propulsão.","RIPEAM, Regra 25",null,null],["luz","Em uma embarcação a vela com menos de 20 metros, as luzes de bordos e de alcançado podem ser exibidas por:",["Uma lanterna combinada, no tope do mastro ou perto dele","Uma luz circular branca, instalada no convés principal","Duas luzes de mastro em linha vertical no tope","Uma luz amarela circular, no tope do mastro"],"Regra 25(b): lanterna combinada instalada no tope do mastro ou próximo, onde melhor possa ser vista.","Tudo em uma lanterna no alto.","RIPEAM, Regra 25(b)",null,null],["luz","Uma embarcação navegando a vela, quando também usando sua propulsão mecânica, deve exibir à vante, de dia:",["Um cone com o vértice para baixo","Um cone com o vértice para cima, à vante","Uma esfera preta, onde melhor possa ser vista","Um cilindro preto, onde melhor possa ser visto"],"Regra 25(e): marca em forma de cone com o vértice para baixo, onde melhor possa ser vista. Ela passa a ser considerada de propulsão mecânica.","Vela mais motor: cone para baixo.","RIPEAM, Regra 25(e)",null,null],["luz","Uma embarcação a vela com menos de 7 metros que não exibe as luzes prescritas deve:",["Ter sempre pronta uma lanterna com luz branca, mostrada a tempo de evitar um abalroamento","Não navegar à noite, devendo recolher-se a um porto antes do pôr do Sol","Exibir uma luz circular amarela no tope do mastro, durante toda a noite","Exibir uma luz verde e uma encarnada, circulares, em linha vertical, no mastro"],"Regra 25(d): se possível exibe as luzes; caso contrário tem sempre pronta uma lanterna elétrica ou a óleo acesa, com luz branca, mostrada com antecedência. O mesmo vale para embarcação a remo.","Uma lanterna comum de luz branca.","RIPEAM, Regra 25(d)",null,null],["luz","Uma embarcação engajada na pesca de arrasto exibe duas luzes circulares em linha vertical. A superior e a inferior são, respectivamente:",["Verde e branca","Encarnada e branca","Branca e verde","Encarnada e verde"],"Regra 26(b): arrasto = verde sobre branca. Pesca que não seja de arrasto = encarnada sobre branca. De dia, dois cones unidos pelos vértices.","Arrasto: verde sobre branca.","RIPEAM, Regra 26",null,null],["luz","Uma embarcação engajada na pesca que não seja de arrasto exibe duas luzes circulares em linha vertical, que são:",["Encarnada em cima e branca embaixo","Verde em cima e branca embaixo","Branca em cima e encarnada embaixo","Verde em cima e encarnada embaixo"],"Regra 26(c): pesca que não seja de arrasto = encarnada sobre branca. Se o equipamento se estender além de 150 m, exibe também uma luz circular branca na direção do aparelho (ou um cone com o vértice para cima, de dia).","Lembrete: «arrasto» tem verde.","RIPEAM, Regra 26(c)",null,null],["luz","Uma embarcação sem governo exibe:",["Duas luzes circulares encarnadas em linha vertical (de dia, duas esferas)","Três luzes circulares, encarnada, branca e encarnada, em linha vertical","Duas luzes circulares, branca sobre encarnada, no tope do mastro","Três luzes circulares encarnadas em linha vertical"],"Regra 27(a): duas luzes circulares encarnadas em linha vertical e, de dia, duas esferas. Com seguimento, também luzes de bordos e de alcançado.","Duas luzes, duas esferas.","RIPEAM, Regra 27(a)",null,null],["luz","Uma embarcação com capacidade de manobra restrita (exceto remoção de minas) exibe, em linha vertical:",["Três luzes circulares: encarnada, branca e encarnada","Duas luzes circulares encarnadas, em linha vertical","Três luzes circulares encarnadas, em linha vertical","Duas luzes circulares, branca sobre encarnada, em linha vertical"],"Regra 27(b): três luzes circulares, a superior e a inferior encarnadas e a do meio branca. De dia, esfera, losango e esfera.","Encarnada, branca, encarnada.","RIPEAM, Regra 27(b)",null,null],["luz","Uma embarcação de capacidade de manobra restrita exibe, de dia, em linha vertical:",["Esfera, losango e esfera","Duas esferas","Cone, esfera e cone","Cilindro"],"Regra 27(b)(II): três marcas em linha vertical, esferas em cima e embaixo e um losango no meio.","As marcas correspondem às luzes encarnada-branca-encarnada.","RIPEAM, Regra 27(b)",null,null],["luz","Uma embarcação engajada em dragagem, com obstrução, exibe duas luzes circulares encarnadas para indicar:",["O bordo em que se encontra a obstrução","O bordo pelo qual outra embarcação poderá passar","Que está sem governo","Que está fundeada"],"Regra 27(d): duas encarnadas (ou duas esferas) indicam o bordo da obstrução; duas verdes (ou dois losangos) indicam o bordo pelo qual se pode passar.","Encarnada = perigo.","RIPEAM, Regra 27(d)",null,null],["luz","Uma embarcação engajada em remoção de minas exibe, além das luzes normais, três luzes circulares verdes ou três esferas, indicando que é perigoso aproximar-se a menos de:",["1.000 metros","200 metros","500 metros","100 metros"],"Regra 27(f): três luzes verdes ou três esferas indicam perigo de aproximação a menos de 1.000 metros.","Um quilômetro.","RIPEAM, Regra 27(f)",null,null],["luz","Uma embarcação restrita devido ao seu calado pode exibir, além das luzes normais de propulsão mecânica:",["Três luzes circulares encarnadas em linha vertical, ou um cilindro","Duas luzes circulares verdes em linha vertical, ou um cone","Uma luz amarela intermitente e três esferas em linha vertical","Três esferas em linha vertical, ou duas luzes circulares brancas"],"Regra 28: três luzes circulares encarnadas em linha vertical, ou, de dia, um cilindro.","Cilindro = calado.","RIPEAM, Regra 28",null,null],["luz","Uma embarcação engajada em serviço de praticagem exibe duas luzes circulares em linha vertical, que são:",["Branca em cima e encarnada embaixo","Encarnada em cima e branca embaixo","Verde em cima e branca embaixo","Branca em cima e verde embaixo"],"Regra 29(a): branca sobre encarnada no tope do mastro. Se em movimento, também luzes de bordos e de alcançado.","Branca sobre encarnada: pratique.","RIPEAM, Regra 29",null,null],["luz","Uma embarcação fundeada de 50 metros ou mais deve exibir:",["Na parte de vante, uma luz circular branca, e na popa, em nível mais baixo, outra luz circular branca","Uma luz circular encarnada a vante e outra, em nível mais alto, na popa do navio","Duas luzes circulares encarnadas, em linha vertical, no estai de vante","Três luzes circulares brancas, em linha vertical, a vante do navio"],"Regra 30(a): luz circular branca a vante e outra circular branca na popa, mais baixa. De dia, uma esfera a vante.","Duas brancas, a de vante mais alta.","RIPEAM, Regra 30",null,null],["luz","Uma embarcação fundeada com menos de 50 metros pode exibir:",["Apenas uma luz circular branca, onde melhor possa ser vista","Uma luz circular amarela, onde melhor possa ser vista","Uma luz circular verde, no tope do mastro","Nenhuma luz, desde que esteja dentro de um porto"],"Regra 30(b): a embarcação com menos de 50 m pode exibir uma só luz circular branca onde melhor possa ser vista.","Uma só luz branca.","RIPEAM, Regra 30(b)",null,null],["luz","Uma embarcação encalhada exibe as luzes de fundeio e, adicionalmente:",["Duas luzes circulares encarnadas em linha vertical (de dia, três esferas)","Duas luzes circulares verdes em linha vertical (de dia, três cones)","Uma luz amarela intermitente (de dia, uma esfera preta)","Três luzes circulares encarnadas em linha vertical (de dia, um cilindro)"],"Regra 30(d): duas luzes circulares encarnadas em linha vertical e, de dia, três esferas em linha vertical.","Encalhada tem duas luzes encarnadas e três esferas.","RIPEAM, Regra 30(d)",null,null],["luz","Segundo o Anexo I, as marcas usadas pelas embarcações (esferas, cones, cilindros, losangos) devem ser:",["Pretas, a esfera com diâmetro não inferior a 0,6 m","Brancas, a esfera com diâmetro mínimo de 1 metro","Encarnadas, a esfera com diâmetro não inferior a 0,6 m","Amarelas, a esfera com diâmetro mínimo de 0,3 m"],"Anexo I, seção 6: as marcas são pretas. Esfera com diâmetro mínimo de 0,6 m e distância vertical mínima de 1,5 m entre marcas.","A cor das marcas é a mesma de uma silhueta.","RIPEAM, Anexo I, 6",null,null],["som","Pelo RIPEAM, um «apito curto» tem duração aproximada de:",["1 segundo","2 segundos","4 segundos","6 segundos"],"Regra 32: apito curto dura cerca de 1 segundo; apito longo dura de 4 a 6 segundos.","Curto é como um «bip».","RIPEAM, Regra 32",null,null],["som","Um «apito longo» tem duração de:",["4 a 6 segundos","1 a 2 segundos","8 a 10 segundos","12 a 15 segundos"],"Regra 32(c): apito longo de 4 a 6 segundos.","Cerca de cinco segundos.","RIPEAM, Regra 32",null,null],["som","Uma embarcação de comprimento igual ou superior a 20 metros deve ser equipada com:",["Apito e sino","Somente apito","Apito, sino e gongo","Somente sino"],"Regra 33(a): 12 m ou mais: apito. 20 m ou mais: apito e sino. 100 m ou mais: apito, sino e gongo.","Cada faixa acrescenta um equipamento.","RIPEAM, Regra 33",null,null],["som","Quando uma embarcação de propulsão mecânica guina para boreste, no visual de outra, ela emite:",["Um apito curto","Dois apitos curtos","Três apitos curtos","Um apito longo"],"Regra 34(a): 1 curto = estou guinando para boreste; 2 curtos = bombordo; 3 curtos = estou dando a ré.","Um para a direita.","RIPEAM, Regra 34(a)",null,null],["som","Dois apitos curtos, emitidos por embarcação de propulsão mecânica no visual de outra, significam:",["Estou guinando para bombordo","Estou guinando para boreste","Estou dando a ré","Tenho dúvidas quanto à sua manobra"],"Regra 34(a): dois apitos curtos indicam guinada para bombordo (e dois lampejos, no sinal luminoso).","Dois para a esquerda.","RIPEAM, Regra 34(a)",null,null],["som","Três apitos curtos, no visual, significam:",["Estou dando a ré","Estou guinando para boreste","Estou guinando para bombordo","Concordo com sua ultrapassagem"],"Regra 34(a): três apitos curtos = estou dando a ré (ou três lampejos).","Três, de volta para trás.","RIPEAM, Regra 34(a)",null,null],["som","O intervalo entre sinais luminosos sucessivos de manobra não deve ser inferior a:",["10 segundos","1 segundo","30 segundos","1 minuto"],"Regra 34(b)(II): cada lampejo dura cerca de 1 s, o intervalo entre lampejos é cerca de 1 s e o intervalo entre sinais sucessivos não pode ser inferior a 10 s.","Mais de 5 e menos de 30.","RIPEAM, Regra 34(b)",null,null],["som","Em canal estreito, o sinal de dois apitos longos seguidos de um apito curto significa:",["Tenho a intenção de ultrapassá-lo por seu boreste","Tenho a intenção de ultrapassá-lo por seu bombordo","Concordo com sua ultrapassagem","Estou em dúvida"],"Regra 34(c)(I): 2 longos + 1 curto = ultrapassar por boreste; 2 longos + 2 curtos = ultrapassar por bombordo.","Um curto: boreste.","RIPEAM, Regra 34(c)",null,null],["som","Dois apitos longos seguidos de dois apitos curtos significam:",["Tenho a intenção de ultrapassá-lo por seu bombordo","Tenho a intenção de ultrapassá-lo por seu boreste","Concordo com a ultrapassagem e darei passagem","Estou dando atrás nas máquinas"],"Regra 34(c)(I): dois longos e dois curtos = pretendo ultrapassá-lo por seu bombordo.","Dois curtos: bombordo.","RIPEAM, Regra 34(c)",null,null],["som","A embarcação a ser ultrapassada em canal estreito indica concordância com o sinal:",["Um apito longo, um curto, um longo e um curto, nesta ordem","Dois apitos curtos, indicando guinada para bombordo","Um apito longo, indicando aproximação de curva do canal","Cinco apitos curtos, indicando dúvida quanto à manobra"],"Regra 34(c)(II): longo, curto, longo, curto.","Alternam: longo e curto, duas vezes.","RIPEAM, Regra 34(c)",null,null],["som","O sinal de dúvida quanto às intenções ou à manobra de outra embarcação é de, pelo menos:",["Cinco apitos curtos","Três apitos curtos","Dois apitos longos","Cinco apitos longos"],"Regra 34(d): pelo menos cinco apitos curtos, podendo ser suplementados por no mínimo cinco lampejos curtos e rápidos.","Cinco, curtos e rápidos.","RIPEAM, Regra 34(d)",null,null],["som","Em visibilidade restrita, uma embarcação de propulsão mecânica com seguimento sobre a água emite, em intervalos não superiores a 2 minutos:",["Um apito longo","Dois apitos longos","Um apito longo e dois curtos","Cinco apitos curtos"],"Regra 35(a): com seguimento = um apito longo, a intervalos de até 2 minutos.","Com seguimento, um só longo.","RIPEAM, Regra 35(a)",null,null],["som","Embarcação de propulsão mecânica sob máquinas, mas parada e sem seguimento, em visibilidade restrita, emite:",["Dois apitos longos sucessivos, com intervalo de cerca de 2 segundos","Um apito longo, a intervalos não superiores a 2 minutos, como as demais","Um apito longo e dois curtos, a intervalos de até 2 minutos","Toques rápidos de sino por cerca de 5 segundos, a cada minuto"],"Regra 35(b): dois apitos longos sucessivos, separados por intervalo de cerca de 2 segundos, a intervalos de até 2 minutos.","Parada: dois longos.","RIPEAM, Regra 35(b)",null,null],["som","Em visibilidade restrita, uma embarcação a vela, uma embarcação engajada na pesca e uma embarcação rebocando emitem:",["Um apito longo e dois curtos, a intervalos não superiores a 2 minutos","Um apito longo, em intervalos não superiores a 2 minutos","Dois apitos longos sucessivos, em intervalos não superiores a 2 minutos","Um apito longo e três curtos, em intervalos não superiores a 2 minutos"],"Regra 35(c): sem governo, capacidade restrita, calado, vela, pesca, rebocando ou empurrando emitem 1 longo e 2 curtos.","Um longo e dois curtos.","RIPEAM, Regra 35(c)",null,null],["som","A embarcação rebocada (ou a última do reboque, se guarnecida), em visibilidade restrita, emite:",["Um apito longo e três curtos","Um apito longo e dois curtos","Dois apitos longos","Cinco apitos curtos"],"Regra 35(e): 1 longo e 3 curtos, se possível imediatamente após o sinal do rebocador.","Um curto a mais que o rebocador.","RIPEAM, Regra 35(e)",null,null],["som","Uma embarcação fundeada com menos de 100 metros, em visibilidade restrita, deve:",["Soar rapidamente o sino por cerca de 5 segundos, em intervalos não superiores a 1 minuto","Soar um apito longo a cada 2 minutos, como as demais embarcações em movimento","Soar dois apitos longos sucessivos, a cada 2 minutos, com a máquina parada","Soar cinco apitos curtos, a cada minuto, até a visibilidade melhorar"],"Regra 35(g): sino rápido por cerca de 5 segundos, a intervalos de até 1 minuto. Acima de 100 m: sino a vante e gongo a ré.","Fundeada usa sino.","RIPEAM, Regra 35(g)",null,null],["som","O sinal facultativo de embarcação fundeada, para indicar sua posição e advertir uma embarcação que se aproxima, é:",["Um apito curto, um longo e um curto","Cinco apitos curtos e rápidos","Três apitos longos, em sequência","Um apito longo e dois curtos, a cada 2 minutos"],"Regra 35(g): uma embarcação fundeada pode soar um curto, um longo e um curto.","Curto, longo, curto.","RIPEAM, Regra 35(g)",null,null],["som","Uma embarcação encalhada, em visibilidade restrita, além do sino rápido deve dar:",["Três badaladas distintas imediatamente antes e depois das batidas rápidas","Cinco apitos curtos imediatamente antes das batidas rápidas do sino","Dois apitos longos imediatamente após as batidas rápidas do sino","Um apito longo e dois curtos, a cada 2 minutos, junto às batidas"],"Regra 35(h): três badaladas separadas e distintas imediatamente antes e depois das batidas rápidas do sino.","Antes e depois.","RIPEAM, Regra 35(h)",null,null],["som","O sinal de identificação de uma embarcação de praticagem engajada em serviço, em visibilidade restrita, é:",["Quatro apitos curtos","Três apitos curtos","Cinco apitos curtos","Um longo e dois curtos"],"Regra 35(k): quatro apitos curtos, além dos sinais das alíneas (a), (b) ou (g).","Quatro curtos.","RIPEAM, Regra 35(k)",null,null],["som","São sinais de perigo e de necessidade de auxílio, segundo o Anexo IV:",["A palavra Mayday por radiotelefonia e um foguete com estrelas encarnadas","Cinco apitos curtos, soados em intervalos de cerca de um minuto","Um apito longo e dois curtos, a intervalos de dois minutos","Duas luzes circulares encarnadas em linha vertical, à noite"],"Anexo IV: entre os sinais estão o SOS, o Mayday, foguetes com estrelas encarnadas, sinal de fumaça alaranjada, toque contínuo de cerração, chamas a bordo e movimento lento dos braços para cima e para baixo.","Sinais de perigo são explícitos.","RIPEAM, Anexo IV",null,null],["som","Um sinal de fumaça de cor alaranjada indica:",["Perigo e necessidade de auxílio","Embarcação fundeada","Visibilidade restrita","Ultrapassagem em canal"],"Anexo IV(j): sinal de fumaça com fumaça de cor alaranjada indica perigo e necessidade de auxílio.","Laranja é a cor de socorro.","RIPEAM, Anexo IV",null,null],["som","Movimentos lentos para cima e para baixo com os braços esticados para os lados indicam:",["Perigo e necessidade de auxílio","Concordo com sua ultrapassagem","Estou dando a ré","Embarcação encalhada"],"Anexo IV(k): este gesto é um sinal de perigo e de necessidade de auxílio.","É como um pássaro pedindo ajuda.","RIPEAM, Anexo IV",null,null],["som","É proibido usar ou exibir os sinais de perigo do Anexo IV:",["Exceto para indicar perigo e necessidade de auxílio","Em qualquer situação de visibilidade restrita ou noturna","Somente à noite, em águas interiores","Somente em alto-mar, fora do alcance de estações costeiras"],"Anexo IV, item 2: são proibidos o uso ou exibição dos sinais de perigo, ou de outros que possam ser confundidos com eles, exceto para indicar perigo e necessidade de auxílio.","Não se usa como brincadeira.","RIPEAM, Anexo IV",null,null],["som","Segundo a Regra 36, para atrair a atenção de outra embarcação, deve-se evitar:",["Luzes intermitentes de grande intensidade ou rotativas, como as estroboscópicas","Dirigir o facho do holofote na direção do perigo","Emitir sinais sonoros que não possam ser confundidos com os das Regras","Emitir sinais luminosos que não possam ser confundidos com os das Regras"],"Regra 36: sinais para chamar a atenção não podem ser confundidos com outros e devem evitar luzes intermitentes de grande intensidade ou estroboscópicas.","Sinal que ofusca ou confunde é proibido.","RIPEAM, Regra 36",null,null],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["sem governo","restrita devido ao seu calado","engajada na pesca, que não seja de arrasto","fundeada, com menos de 50 metros"],"Duas luzes circulares encarnadas em linha vertical (de dia, duas esferas) identificam a embarcação sem governo. Com seguimento, exibe também luzes de bordos e de alcançado.","É a embarcação que perdeu a capacidade de manobrar.","RIPEAM, Regra 27(a)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"52\" x2=\"150\" y2=\"148\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"82\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"82\" r=\"8\" fill=\"#FF5147\"/><circle cx=\"150\" cy=\"118\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"118\" r=\"8\" fill=\"#FF5147\"/></svg>","Duas luzes circulares encarnadas em linha vertical, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["com capacidade de manobra restrita","engajada na pesca de arrasto","em serviço de praticagem","rebocando, com reboque inferior a 200 metros"],"Encarnada, branca e encarnada, em linha vertical, identificam a embarcação com capacidade de manobra restrita (de dia: esfera, losango e esfera). A luz do meio é branca.","O trabalho que ela faz, como dragagem ou lançamento de cabos, limita sua manobra.","RIPEAM, Regra 27(b)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"34\" x2=\"150\" y2=\"166\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"64\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"64\" r=\"8\" fill=\"#FF5147\"/><circle cx=\"150\" cy=\"100\" r=\"16\" fill=\"#FFFFFF\" opacity=\".22\"/><circle cx=\"150\" cy=\"100\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"150\" cy=\"136\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"136\" r=\"8\" fill=\"#FF5147\"/></svg>","Três luzes circulares em linha vertical: encarnada, branca e encarnada, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["restrita devido ao seu calado","engajada na pesca, que não seja de arrasto","engajada em remoção de minas","sem governo"],"Três luzes circulares encarnadas em linha vertical (de dia, um cilindro) podem ser exibidas pela embarcação restrita devido ao seu calado, além das luzes de propulsão mecânica.","A profundidade disponível limita o quanto ela pode desviar.","RIPEAM, Regra 28","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"34\" x2=\"150\" y2=\"166\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"64\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"64\" r=\"8\" fill=\"#FF5147\"/><circle cx=\"150\" cy=\"100\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"100\" r=\"8\" fill=\"#FF5147\"/><circle cx=\"150\" cy=\"136\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"136\" r=\"8\" fill=\"#FF5147\"/></svg>","Três luzes circulares encarnadas em linha vertical, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["engajada na pesca de arrasto","em serviço de praticagem","fundeada, com menos de 50 metros","com capacidade de manobra restrita"],"Verde sobre branca, em linha vertical, identifica pesca de arrasto. Há ainda uma luz de mastro a ré e mais alta (opcional abaixo de 50 m) e, com seguimento, luzes de bordos e de alcançado.","A cor de cima é a mesma de boreste. Pense na rede sendo arrastada.","RIPEAM, Regra 26(b)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"52\" x2=\"150\" y2=\"148\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"82\" r=\"16\" fill=\"#35E58A\" opacity=\".22\"/><circle cx=\"150\" cy=\"82\" r=\"8\" fill=\"#35E58A\"/><circle cx=\"150\" cy=\"118\" r=\"16\" fill=\"#FFFFFF\" opacity=\".22\"/><circle cx=\"150\" cy=\"118\" r=\"8\" fill=\"#FFFFFF\"/></svg>","Duas luzes circulares em linha vertical: verde em cima e branca embaixo, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["engajada na pesca, que não seja de arrasto","engajada em remoção de minas","rebocando, com reboque inferior a 200 metros","restrita devido ao seu calado"],"Encarnada sobre branca, em linha vertical, identifica a pesca que não é de arrasto. Se o aparelho se estende além de 150 m, exibe ainda uma luz circular branca na direção do aparelho.","Na pesca de arrasto a luz de cima é verde. Aqui é outra cor.","RIPEAM, Regra 26(c)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"52\" x2=\"150\" y2=\"148\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"82\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"82\" r=\"8\" fill=\"#FF5147\"/><circle cx=\"150\" cy=\"118\" r=\"16\" fill=\"#FFFFFF\" opacity=\".22\"/><circle cx=\"150\" cy=\"118\" r=\"8\" fill=\"#FFFFFF\"/></svg>","Duas luzes circulares em linha vertical: encarnada em cima e branca embaixo, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["em serviço de praticagem","fundeada, com menos de 50 metros","sem governo","engajada na pesca de arrasto"],"Branca sobre encarnada, no tope do mastro, identifica a embarcação em serviço de praticagem. Em movimento, exibe também luzes de bordos e de alcançado.","É a embarcação que leva o prático a bordo.","RIPEAM, Regra 29","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"52\" x2=\"150\" y2=\"148\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"82\" r=\"16\" fill=\"#FFFFFF\" opacity=\".22\"/><circle cx=\"150\" cy=\"82\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"150\" cy=\"118\" r=\"16\" fill=\"#FF5147\" opacity=\".22\"/><circle cx=\"150\" cy=\"118\" r=\"8\" fill=\"#FF5147\"/></svg>","Duas luzes circulares em linha vertical: branca em cima e encarnada embaixo, à noite."],["luz","À noite, você avista as luzes mostradas na figura. Elas identificam uma embarcação:",["engajada em remoção de minas","rebocando, com reboque inferior a 200 metros","com capacidade de manobra restrita","engajada na pesca, que não seja de arrasto"],"Três luzes circulares verdes (ou três esferas), uma no tope do mastro de vante e uma em cada lais da verga, indicam que é perigoso aproximar-se a menos de 1.000 m.","Perigo para quem se aproxima a menos de 1.000 metros.","RIPEAM, Regra 27(f)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"165\" stroke=\"#3F5B78\" stroke-width=\"3\"/><line x1=\"100\" y1=\"120\" x2=\"200\" y2=\"120\" stroke=\"#3F5B78\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"62\" r=\"16\" fill=\"#35E58A\" opacity=\".22\"/><circle cx=\"150\" cy=\"62\" r=\"8\" fill=\"#35E58A\"/><circle cx=\"100\" cy=\"120\" r=\"16\" fill=\"#35E58A\" opacity=\".22\"/><circle cx=\"100\" cy=\"120\" r=\"8\" fill=\"#35E58A\"/><circle cx=\"200\" cy=\"120\" r=\"16\" fill=\"#35E58A\" opacity=\".22\"/><circle cx=\"200\" cy=\"120\" r=\"8\" fill=\"#35E58A\"/></svg>","Três luzes circulares verdes: uma no tope do mastro e duas nas pontas da verga, formando um triângulo, à noite."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["sem governo","restrita devido ao seu calado","a vela, com a propulsão mecânica em uso","fundeada"],"Duas esferas pretas em linha vertical, de dia, identificam a embarcação sem governo (à noite, duas luzes circulares encarnadas).","Duas marcas iguais, redondas.","RIPEAM, Regra 27(a)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"70\" r=\"15\" fill=\"#14181D\"/><circle cx=\"150\" cy=\"112\" r=\"15\" fill=\"#14181D\"/></svg>","Duas esferas pretas em linha vertical."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["com capacidade de manobra restrita","engajada na pesca","encalhada","rebocando, com reboque superior a 200 metros"],"Esfera, losango e esfera, em linha vertical, identificam a embarcação com capacidade de manobra restrita (à noite: encarnada, branca e encarnada).","O losango fica no meio, entre duas esferas.","RIPEAM, Regra 27(b)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"45\" r=\"15\" fill=\"#14181D\"/><polygon points=\"150,70 135,100 165,100\" fill=\"#14181D\"/><polygon points=\"135,100 165,100 150,130\" fill=\"#14181D\"/><circle cx=\"150\" cy=\"155\" r=\"15\" fill=\"#14181D\"/></svg>","Três marcas pretas em linha vertical: esfera, losango e esfera."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["restrita devido ao seu calado","a vela, com a propulsão mecânica em uso","engajada em remoção de minas","sem governo"],"Um cilindro é a marca da embarcação restrita devido ao seu calado (à noite, três luzes circulares encarnadas).","A marca tem a forma de uma lata em pé.","RIPEAM, Regra 28","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><rect x=\"136\" y=\"72\" width=\"28\" height=\"56\" rx=\"2\" fill=\"#14181D\"/></svg>","Um cilindro preto."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["engajada na pesca","encalhada","fundeada","com capacidade de manobra restrita"],"Dois cones unidos pelos vértices, dispostos na vertical, identificam a embarcação engajada na pesca, de arrasto ou não.","A forma lembra uma ampulheta.","RIPEAM, Regra 26(b) e (c)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"135,70 165,70 150,100\" fill=\"#14181D\"/><polygon points=\"150,100 135,130 165,130\" fill=\"#14181D\"/></svg>","Dois cones pretos unidos pelos vértices, um sobre o outro (forma de ampulheta)."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["a vela, com a propulsão mecânica em uso","engajada em remoção de minas","rebocando, com reboque superior a 200 metros","restrita devido ao seu calado"],"Quando navega a vela e também usa a propulsão mecânica, a embarcação exibe a vante um cone com o vértice para baixo.","Ponta do cone para baixo.","RIPEAM, Regra 25(e)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"135,85 165,85 150,115\" fill=\"#14181D\"/></svg>","Um cone preto com o vértice para baixo."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["encalhada","fundeada","sem governo","engajada na pesca"],"Três esferas em linha vertical, além da marca de fundeio, identificam a embarcação encalhada (à noite, duas luzes circulares encarnadas).","Três marcas iguais, uma sobre a outra.","RIPEAM, Regra 30(d)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"45\" r=\"15\" fill=\"#14181D\"/><circle cx=\"150\" cy=\"95\" r=\"15\" fill=\"#14181D\"/><circle cx=\"150\" cy=\"145\" r=\"15\" fill=\"#14181D\"/></svg>","Três esferas pretas em linha vertical."],["luz","De dia, você avista a marca mostrada na figura. Ela identifica uma embarcação:",["engajada em remoção de minas","rebocando, com reboque superior a 200 metros","com capacidade de manobra restrita","a vela, com a propulsão mecânica em uso"],"Três esferas, uma no tope do mastro e duas nas pontas da verga, indicam perigo para quem se aproxima a menos de 1.000 m.","Repare no arranjo: elas formam um triângulo, e não uma coluna.","RIPEAM, Regra 27(f)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"55\" r=\"15\" fill=\"#14181D\"/><circle cx=\"105\" cy=\"112\" r=\"15\" fill=\"#14181D\"/><circle cx=\"195\" cy=\"112\" r=\"15\" fill=\"#14181D\"/><line x1=\"100\" y1=\"112\" x2=\"200\" y2=\"112\" stroke=\"#6B7F92\" stroke-width=\"3\"/></svg>","Três esferas pretas: uma no tope do mastro e duas nas pontas da verga, formando um triângulo."],["luz","Uma embarcação rebocando exibe a marca mostrada na figura, um losango. Isso indica comprimento de reboque:",["Superior a 200 metros","Inferior a 200 metros","Superior a 100 metros","Superior a 50 metros"],"O losango é exibido quando o comprimento do reboque, da popa do rebocador à popa do rebocado, é superior a 200 m. À noite, o rebocador usa três luzes de mastro em linha vertical.","É o limite em que o rebocador passa a usar três luzes de mastro.","RIPEAM, Regra 24(a) e (e)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"150,70 135,100 165,100\" fill=\"#14181D\"/><polygon points=\"135,100 165,100 150,130\" fill=\"#14181D\"/></svg>","Uma marca preta em forma de losango, formada por dois cones unidos pelas bases."],["luz","Uma embarcação de pesca exibe a marca mostrada na figura, um cone com o vértice para cima. Isso indica:",["Aparelho de pesca estendido a mais de 150 m na direção do cone","Embarcação navegando a vela com a máquina em uso","Embarcação restrita devido ao seu calado","Aparelho de pesca recolhido, pronto para a navegação"],"Na pesca que não seja de arrasto, quando o equipamento se estende a mais de 150 m, exibe-se um cone com o vértice para cima, na direção do aparelho (à noite, luz circular branca).","O vértice aponta para onde está o aparelho.","RIPEAM, Regra 26(c)(II)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"150,85 135,115 165,115\" fill=\"#14181D\"/></svg>","Um cone preto com o vértice para cima."],["luz","O setor branco destacado na figura corresponde à luz de:",["Mastro","Alcançado","Bordos","Reboque"],"A luz de mastro é branca, contínua, sobre o eixo longitudinal, e cobre 225°: da proa até 22,5° por ante-a-ré do través, em cada bordo.","É o setor mais largo, e abrange a proa.","RIPEAM, Regra 21(a)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><path d=\"M150,112 L71.5,144.5 A85,85 0 1 1 228.5,144.5 Z\" fill=\"#FFFFFF\" fill-opacity=\"0.32\" stroke=\"#FFFFFF\" stroke-width=\"1.5\"/><polygon points=\"150,78 161,98 161,128 139,128 139,98\" fill=\"#9FB3C5\"/><text x=\"150\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#9DB3C5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">proa</text></svg>","Vista de cima de uma embarcação com um setor branco amplo cobrindo a proa e os dois bordos, até um pouco atrás do través."],["luz","O setor branco destacado na figura, atrás da embarcação, corresponde à luz de:",["Alcançado","Mastro","Bordos","Fundeio"],"A luz de alcançado é branca e cobre 135°: 67,5° para cada bordo, a partir da popa. A luz de reboque é amarela e tem as mesmas características.","Fica na popa e só é vista por quem vem de trás.","RIPEAM, Regra 21(c)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><path d=\"M150,112 L228.5,144.5 A85,85 0 0 1 71.5,144.5 Z\" fill=\"#FFFFFF\" fill-opacity=\"0.32\" stroke=\"#FFFFFF\" stroke-width=\"1.5\"/><polygon points=\"150,78 161,98 161,128 139,128 139,98\" fill=\"#9FB3C5\"/><text x=\"150\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#9DB3C5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">proa</text></svg>","Vista de cima de uma embarcação com um setor branco atrás da popa."],["luz","Os setores verde e encarnado da figura cobrem, cada um, uma abertura de:",["112,5°","135°","225°","90°"],"As luzes de bordos (verde a boreste e encarnada a bombordo) cobrem 112,5° cada, da proa até 22,5° por ante-a-ré do través do seu bordo. As duas juntas somam 225°.","Os dois setores juntos têm a mesma abertura da luz de mastro.","RIPEAM, Regra 21(b)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#0B1E33\"/><path d=\"M150,112 L71.5,144.5 A85,85 0 0 1 150.0,27.0 Z\" fill=\"#FF5147\" fill-opacity=\"0.4\" stroke=\"#FF5147\" stroke-width=\"1.5\"/><path d=\"M150,112 L150.0,27.0 A85,85 0 0 1 228.5,144.5 Z\" fill=\"#35E58A\" fill-opacity=\"0.4\" stroke=\"#35E58A\" stroke-width=\"1.5\"/><polygon points=\"150,78 161,98 161,128 139,128 139,98\" fill=\"#9FB3C5\"/><text x=\"150\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#9DB3C5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">proa</text></svg>","Vista de cima de uma embarcação com setor encarnado à esquerda da proa e setor verde à direita, cada um indo da proa até um pouco atrás do través."],["gov","As embarcações A e B, ambas de propulsão mecânica, aproximam-se em rumos opostos, como na figura, com risco de abalroamento. O que devem fazer?",["Ambas guinar para boreste, passando bombordo com bombordo","A guinar para boreste e B manter rumo e velocidade","Ambas guinar para bombordo, passando boreste com boreste","A manter rumo e velocidade e B guinar para bombordo"],"Na situação de roda a roda, nenhuma embarcação tem preferência: cada uma guina para boreste, de modo que a passagem se dê por bombordo uma da outra.","Nenhuma das duas tem preferência.","RIPEAM, Regra 14","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#CFE3F1\"/><g transform=\"translate(140 150) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#0B5FA5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#0B5FA5\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#0B5FA5\"/></g><circle cx=\"112\" cy=\"150\" r=\"12\" fill=\"#fff\" stroke=\"#0B5FA5\" stroke-width=\"2\"/><text x=\"112\" y=\"155\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#0B5FA5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">A</text><g transform=\"translate(160 52) rotate(180)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#B4531B\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#B4531B\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#B4531B\"/></g><circle cx=\"188\" cy=\"52\" r=\"12\" fill=\"#fff\" stroke=\"#B4531B\" stroke-width=\"2\"/><text x=\"188\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B4531B\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">B</text></svg>","Vista de cima: A segue para cima e B segue para baixo, em rumos quase opostos, um de frente para o outro."],["gov","A e B são embarcações de propulsão mecânica com rumos que se cruzam, como na figura, com risco de abalroamento. Quem deve se manter fora do caminho?",["A, que avista B por seu boreste","B, que avista A por seu bombordo","Ambas devem guinar para bombordo","Nenhuma: ambas mantêm rumo e velocidade"],"Na situação de rumos cruzados, a embarcação que avista a outra por boreste se mantém fora do caminho dela e, se possível, evita cruzar sua proa.","Quem vê a outra pela direita é quem cede.","RIPEAM, Regra 15","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#CFE3F1\"/><g transform=\"translate(110 150) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#0B5FA5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#0B5FA5\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#0B5FA5\"/></g><circle cx=\"82\" cy=\"150\" r=\"12\" fill=\"#fff\" stroke=\"#0B5FA5\" stroke-width=\"2\"/><text x=\"82\" y=\"155\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#0B5FA5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">A</text><g transform=\"translate(215 98) rotate(270)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#B4531B\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#B4531B\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#B4531B\"/></g><circle cx=\"243\" cy=\"98\" r=\"12\" fill=\"#fff\" stroke=\"#B4531B\" stroke-width=\"2\"/><text x=\"243\" y=\"103\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B4531B\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">B</text></svg>","Vista de cima: A segue para cima e B, à direita de A, segue para a esquerda, cruzando o rumo de A."],["gov","A e B são embarcações de propulsão mecânica com rumos que se cruzam, como na figura, com risco de abalroamento. Quem deve se manter fora do caminho?",["B, que avista A por seu boreste","A, que avista B por seu bombordo","Ambas devem guinar para bombordo","Nenhuma: ambas mantêm rumo e velocidade"],"A está pela direita (boreste) de B, então B é a obrigada a manobrar. A, que tem preferência, mantém rumo e velocidade (Regra 17).","Pergunte-se de que lado cada uma enxerga a outra.","RIPEAM, Regras 15 e 17","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#CFE3F1\"/><g transform=\"translate(190 150) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#0B5FA5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#0B5FA5\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#0B5FA5\"/></g><circle cx=\"218\" cy=\"150\" r=\"12\" fill=\"#fff\" stroke=\"#0B5FA5\" stroke-width=\"2\"/><text x=\"218\" y=\"155\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#0B5FA5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">A</text><g transform=\"translate(85 98) rotate(90)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#B4531B\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#B4531B\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#B4531B\"/></g><circle cx=\"57\" cy=\"98\" r=\"12\" fill=\"#fff\" stroke=\"#B4531B\" stroke-width=\"2\"/><text x=\"57\" y=\"103\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B4531B\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">B</text></svg>","Vista de cima: A segue para cima e B, à esquerda de A, segue para a direita, cruzando o rumo de A."],["gov","A embarcação B, mais veloz, vem por trás de A, como na figura, vinda de mais de 22,5° para ré do través de A. Quem deve se manter fora do caminho?",["B, até ultrapassar A inteiramente e ficar bem safa","A, guinando para boreste para facilitar a passagem","A, por ser a embarcação mais lenta","Nenhuma: ambas mantêm rumo e velocidade"],"Quem está alcançando mantém-se fora do caminho da alcançada, até ultrapassá-la inteiramente e estar suficientemente afastada, mesmo que a marcação mude depois.","À noite, B só veria a luz de popa de A.","RIPEAM, Regra 13","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#CFE3F1\"/><g transform=\"translate(140 90) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#0B5FA5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#0B5FA5\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#0B5FA5\"/></g><circle cx=\"112\" cy=\"90\" r=\"12\" fill=\"#fff\" stroke=\"#0B5FA5\" stroke-width=\"2\"/><text x=\"112\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#0B5FA5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">A</text><g transform=\"translate(162 168) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#B4531B\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#B4531B\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#B4531B\"/></g><circle cx=\"190\" cy=\"168\" r=\"12\" fill=\"#fff\" stroke=\"#B4531B\" stroke-width=\"2\"/><text x=\"190\" y=\"173\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B4531B\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">B</text></svg>","Vista de cima: A e B seguem para cima, com B atrás de A e ligeiramente à direita."],["gov","A é de propulsão mecânica e B navega a vela, como na figura, com rumos que se cruzam e risco de abalroamento. Quem deve se manter fora do caminho?",["A, porque embarcação de propulsão mecânica cede à embarcação a vela","B, porque avista A por seu boreste","Nenhuma delas, pois a vela só cede em canal estreito","A e B devem guinar para boreste"],"A regra de rumos cruzados vale entre embarcações de propulsão mecânica. Entre motor e vela, a embarcação de propulsão mecânica em movimento se mantém fora do caminho da embarcação a vela (Regra 18).","Ser de propulsão mecânica pesa mais que o lado em que se avista a outra.","RIPEAM, Regra 18(a)","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#CFE3F1\"/><g transform=\"translate(190 150) rotate(0)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#0B5FA5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#0B5FA5\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#0B5FA5\"/></g><circle cx=\"218\" cy=\"150\" r=\"12\" fill=\"#fff\" stroke=\"#0B5FA5\" stroke-width=\"2\"/><text x=\"218\" y=\"155\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#0B5FA5\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">A</text><g transform=\"translate(85 98) rotate(90)\"><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-62\" stroke=\"#B4531B\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"-6,-62 6,-62 0,-74\" fill=\"#B4531B\"/><polygon points=\"0,-26 11,-8 11,18 -11,18 -11,-8\" fill=\"#B4531B\"/><polygon points=\"0,-12 9,12 0,12\" fill=\"#fff\" stroke=\"#fff\"/></g><circle cx=\"57\" cy=\"98\" r=\"12\" fill=\"#fff\" stroke=\"#B4531B\" stroke-width=\"2\"/><text x=\"57\" y=\"103\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B4531B\" font-family=\"system-ui,-apple-system,Segoe UI,Roboto,sans-serif\">B</text></svg>","Vista de cima: A, de propulsão mecânica, segue para cima. B, à esquerda de A e com uma vela, segue para a direita."],["bal","A marca de topo mostrada na figura pertence ao sinal cardinal:",["Norte","Sul","Leste","Oeste"],"Cardinal Norte: dois cones superpostos com os vértices para cima (preto sobre amarelo). As águas mais profundas estão ao norte do sinal. À noite, lampejos brancos contínuos.","A direção aponta para onde as pontas apontam.","Balizamento, 2.7.3","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"150,51 135,81 165,81\" fill=\"#14181D\"/><polygon points=\"150,95 135,125 165,125\" fill=\"#14181D\"/></svg>","Dois cones pretos, um sobre o outro, com os vértices para cima."],["bal","A marca de topo mostrada na figura pertence ao sinal cardinal:",["Sul","Norte","Leste","Oeste"],"Cardinal Sul: dois cones com os vértices para baixo (amarelo sobre preto). À noite, 6 lampejos brancos.","As pontas apontam para baixo.","Balizamento, 2.7.3","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"135,51 165,51 150,81\" fill=\"#14181D\"/><polygon points=\"135,95 165,95 150,125\" fill=\"#14181D\"/></svg>","Dois cones pretos, um sobre o outro, com os vértices para baixo."],["bal","A marca de topo mostrada na figura pertence ao sinal cardinal:",["Leste","Norte","Sul","Oeste"],"Cardinal Leste: dois cones unidos pela base (preto com larga faixa amarela). À noite, 3 lampejos brancos.","Pense em um losango.","Balizamento, 2.7.3","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"150,66 135,96 165,96\" fill=\"#14181D\"/><polygon points=\"135,96 165,96 150,126\" fill=\"#14181D\"/></svg>","Dois cones pretos unidos pelas bases, formando um losango vertical."],["bal","A marca de topo mostrada na figura pertence ao sinal cardinal:",["Oeste","Norte","Sul","Leste"],"Cardinal Oeste: dois cones unidos pelos vértices (amarelo com larga faixa preta). À noite, 9 lampejos brancos.","Pense em uma ampulheta.","Balizamento, 2.7.3","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><polygon points=\"135,66 165,66 150,96\" fill=\"#14181D\"/><polygon points=\"150,96 135,126 165,126\" fill=\"#14181D\"/></svg>","Dois cones pretos unidos pelos vértices, formando uma ampulheta."],["bal","A marca de topo mostrada na figura, de duas esferas pretas, identifica o sinal de:",["Perigo isolado","Águas seguras","Cardinal Norte","Canal preferencial"],"Duas esferas pretas, uma sobre a outra, são a marca do sinal de perigo isolado: um perigo de tamanho limitado, em torno do qual as águas são seguras. À noite, 2 lampejos brancos por período.","A quantidade de esferas coincide com a de lampejos à noite.","Balizamento, 2.7.3","<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><rect width=\"300\" height=\"200\" rx=\"10\" fill=\"#D9E8F3\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#8FB3CE\"/><line x1=\"150\" y1=\"14\" x2=\"150\" y2=\"176\" stroke=\"#6B7F92\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"70\" r=\"15\" fill=\"#14181D\"/><circle cx=\"150\" cy=\"112\" r=\"15\" fill=\"#14181D\"/></svg>","Duas esferas pretas, uma sobre a outra."]];
